<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>เงาสะแก — Sakae Survival</title>
<style>
:root{
  --ink:#070a09; --ink2:#0e1412; --panel:#141b18; --panel2:#1a2320;
  --line:#243029; --line2:#33443a;
  --moss:#8aa863; --amber:#d9a441; --gold:#c9a227; --rust:#b04a2f;
  --bone:#e2ddcb; --dim:#78877e; --sick:#9b7fb5;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);color:var(--bone);
font-family:"Sarabun","Noto Sans Thai",-apple-system,system-ui,sans-serif;
-webkit-font-smoothing:antialiased}
canvas{display:block;width:100%;height:100%;touch-action:none}

/* ============ HUD ============ */
#hud{position:fixed;top:0;left:0;right:0;z-index:5;pointer-events:none;
padding:9px 11px 0;background:linear-gradient(180deg,rgba(5,8,7,.92) 40%,rgba(5,8,7,0))}
.hudTop{display:flex;align-items:flex-start;gap:10px}

/* แผ่นป้ายทองเหลืองสลักวันเวลา */
.plate{flex:0 0 auto;padding:6px 11px 6px 9px;border-radius:3px;
background:linear-gradient(150deg,rgba(201,162,39,.13),rgba(201,162,39,.03) 55%,rgba(0,0,0,.25));
border:1px solid rgba(201,162,39,.30);border-left:2px solid var(--gold);
box-shadow:inset 0 1px 0 rgba(255,235,180,.10), 0 2px 10px rgba(0,0,0,.5)}
.pTime{font-size:21px;line-height:1;font-weight:600;color:#f0e6cd;
letter-spacing:1.5px;font-variant-numeric:tabular-nums;
text-shadow:0 1px 0 rgba(0,0,0,.7)}
.pDay{font-size:9.5px;letter-spacing:2.6px;color:var(--gold);margin-bottom:3px}
.pMeta{font-size:10px;color:var(--dim);margin-top:4px;letter-spacing:.3px}
.pMeta em{font-style:normal;color:#a8b5a5}

/* วงแหวนสถานะ */
.rings{display:flex;gap:2px;margin-left:auto}
.ring{position:relative;width:44px;text-align:center}
.ring svg{width:40px;height:40px;transform:rotate(-90deg);display:block;margin:0 auto}
.ring circle{fill:none;stroke-width:3.2;stroke-linecap:round}
.ring .bg{stroke:rgba(255,255,255,.07)}
.ring .fg{transition:stroke-dasharray .35s ease}
.ring .rv{position:absolute;top:11px;left:0;right:0;font-size:12px;font-weight:600;
line-height:1;font-variant-numeric:tabular-nums;color:#e8e2ce}
.ring .rl{font-size:8.5px;letter-spacing:1.4px;color:var(--dim);margin-top:-8px}
.ring.low .rv{color:#ff9b7a}
.ring.low svg{animation:pulseR 1.5s ease-in-out infinite}
@keyframes pulseR{50%{opacity:.45}}

/* แถบเวลา 24 ชั่วโมง */
.horizon{position:relative;height:3px;margin:7px 1px 0;border-radius:2px;overflow:hidden;
background:linear-gradient(90deg,
 #0a1226 0%, #0a1226 20%, #6b4a2a 26%, #c9a76a 32%,
 #cfd6c4 42%, #cfd6c4 62%, #c98a4a 72%, #7a3a24 78%, #0a1226 84%, #0a1226 100%);
box-shadow:inset 0 0 0 1px rgba(0,0,0,.5)}
.hMark{position:absolute;top:-2px;width:2px;height:7px;background:#fff;
box-shadow:0 0 5px rgba(255,255,255,.9);transition:left .3s linear}
.hLabel{font-size:8.5px;letter-spacing:1.8px;color:var(--dim);margin-top:3px;
display:flex;justify-content:space-between;padding:0 1px}

/* ป้ายเตือนติดเชื้อ */
#infChip{display:none;margin-top:6px;font-size:10.5px;letter-spacing:.5px;
padding:3px 9px;border-radius:2px;color:#d6c2ea;background:rgba(155,127,181,.12);
border:1px solid rgba(155,127,181,.4);border-left:2px solid var(--sick);
animation:sickPulse 2.4s ease-in-out infinite}
#infChip.on{display:inline-block}
@keyframes sickPulse{50%{background:rgba(155,127,181,.24)}}

/* ============ แถบคำสั่งล่าง ============ */
#dock{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;
padding:0;background:linear-gradient(0deg,#080c0a 62%,rgba(8,12,10,.86) 88%,rgba(8,12,10,0));
border-top:1px solid var(--line2);
box-shadow:0 -1px 0 rgba(255,255,255,.04), 0 -10px 24px rgba(0,0,0,.6)}
#dock button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
background:none;border:none;border-radius:0;padding:9px 2px 11px;color:var(--dim);
font-size:10px;letter-spacing:.4px;position:relative}
#dock button+button::before{content:'';position:absolute;left:0;top:12px;bottom:12px;
width:1px;background:var(--line)}
#dock button svg{width:19px;height:19px;stroke:currentColor;fill:none;
stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#dock button:active{background:rgba(255,255,255,.04)}
#dock button.pri{color:var(--amber)}
#dock button.pri::after{content:'';position:absolute;top:0;left:18%;right:18%;height:2px;
background:linear-gradient(90deg,transparent,var(--amber),transparent)}
#dock button:disabled{color:#3f4a44}
#dock button:disabled::after{display:none}
#dock button:focus-visible{outline:1px solid var(--amber);outline-offset:-3px}

/* ============ ปุ่มทั่วไป ============ */
button{font-family:inherit;font-size:12.5px;color:var(--bone);background:var(--panel);
border:1px solid var(--line2);border-radius:3px;padding:9px 12px;cursor:pointer;flex:1;
letter-spacing:.3px;transition:background .12s,border-color .12s}
button:active{background:var(--panel2)}
button.pri{border-color:rgba(201,162,39,.55);color:#f0dfae;
background:linear-gradient(180deg,rgba(201,162,39,.14),rgba(201,162,39,.04))}
button.danger{border-color:rgba(176,74,47,.55);color:#e8ac97}
button:disabled{opacity:.32}
button:focus-visible{outline:1px solid var(--amber);outline-offset:2px}

/* ============ หน้าต่าง ============ */
.modal{position:fixed;inset:0;z-index:20;background:rgba(3,5,4,.86);
backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex;animation:fadeIn .18s ease}
#mSheet{z-index:22}
@keyframes fadeIn{from{opacity:0}}
.sheet{width:100%;max-width:560px;max-height:90vh;overflow-y:auto;
background:linear-gradient(180deg,var(--ink2),#0b100e);
border:1px solid var(--line2);border-bottom:none;border-radius:10px 10px 0 0;
padding:0 14px 16px;animation:slideUp .22s cubic-bezier(.2,.8,.3,1);
box-shadow:0 -14px 40px rgba(0,0,0,.7)}
@keyframes slideUp{from{transform:translateY(26px);opacity:.4}}
.sheet::before{content:'';display:block;width:38px;height:3px;border-radius:2px;
background:var(--line2);margin:9px auto 12px}
.eyebrow{font-size:9px;letter-spacing:3px;color:var(--gold);margin-bottom:4px}
.sheet h2{margin:0;font-size:17px;font-weight:600;letter-spacing:.4px;color:#efe9d6}
.sheet .sub{color:var(--dim);font-size:11.5px;margin:3px 0 0;padding-bottom:10px;
border-bottom:1px solid var(--line);letter-spacing:.2px}

.list{display:flex;flex-direction:column;gap:4px;margin:9px 0}
.item{display:flex;gap:9px;align-items:center;padding:9px 11px;
background:linear-gradient(180deg,var(--panel),rgba(16,22,19,.6));
border:1px solid var(--line);border-left:2px solid var(--line2);
border-radius:3px;font-size:13px}
.item .nm{flex:1;line-height:1.35}
.item .qt{color:var(--dim);font-variant-numeric:tabular-nums;font-size:12px}
.item button{flex:0 0 auto;padding:5px 10px;font-size:11.5px}
.item.acc-food{border-left-color:#c98a4a}
.item.acc-med{border-left-color:#5f9e8f}
.item.acc-mat{border-left-color:#6d7a68}
.item.acc-drop{border-left-color:#8d5a4e}
.item.acc-c{border-left-color:#9aa0a0}.item.acc-u{border-left-color:#8fbf6a}
.item.acc-r{border-left-color:#6aa8d8}.item.acc-e{border-left-color:#b184d8}
.item.acc-l{border-left-color:#e0b03c;
background:linear-gradient(180deg,rgba(201,162,39,.10),rgba(16,22,19,.6))}
.tagline{font-size:10.5px;color:var(--dim);line-height:1.55}

.log{font-size:12px;line-height:1.6;background:#080c0a;border:1px solid var(--line);
border-radius:3px;padding:10px;max-height:29vh;overflow-y:auto}
.log div{padding:1px 0}
.log .a{color:var(--amber)}.log .r{color:#e08a72}
.log .g{color:var(--moss)}.log .d{color:var(--dim)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.chip{display:inline-block;font-size:9px;padding:1.5px 6px;border-radius:2px;
border:1px solid var(--line2);color:var(--dim);margin-left:5px;letter-spacing:.6px;
vertical-align:1px}
.r-c{color:#b9bebe}.r-u{color:#8fbf6a}.r-r{color:#6aa8d8}
.r-e{color:#b184d8}.r-l{color:#e0b03c;text-shadow:0 0 10px rgba(224,176,60,.45)}

.tabs{display:flex;gap:0;margin:10px 0 4px;border-bottom:1px solid var(--line)}
.tabs button{padding:8px 4px;font-size:11.5px;background:none;border:none;
border-bottom:2px solid transparent;border-radius:0;color:var(--dim);letter-spacing:.4px}
.tabs button.on{color:var(--amber);border-bottom-color:var(--amber)}

/* แถบสถานะในหน้าต่างต่อสู้ */
.bar{display:flex;align-items:center;gap:8px;font-size:10px;letter-spacing:1px;
color:var(--dim);margin-bottom:5px}
.bar .track{flex:1;height:9px;border:1px solid var(--line2);border-radius:2px;
overflow:hidden;position:relative;
background:repeating-linear-gradient(90deg,#0a0e0c 0 8px,#12181500 8px 9px)}
.bar .track::after{content:'';position:absolute;inset:0;pointer-events:none;
background:repeating-linear-gradient(90deg,transparent 0 11px,rgba(0,0,0,.55) 11px 12px)}
.bar .fill{height:100%;transition:width .25s}
.bar span{width:30px;text-align:right;font-variant-numeric:tabular-nums;
color:var(--bone);font-size:11px}

.drop{border:1px solid rgba(138,168,99,.35);border-left:2px solid var(--moss);
background:linear-gradient(180deg,rgba(138,168,99,.09),rgba(10,15,12,.5));
border-radius:3px;padding:10px 12px;margin-top:9px}
.drop .h{font-size:9px;letter-spacing:2.6px;color:var(--moss);margin-bottom:6px}
.drop .l{font-size:12.5px;line-height:1.75}
.drop .miss{color:#5d6a62;text-decoration:line-through}

#toast{position:fixed;left:50%;top:42%;transform:translateX(-50%);z-index:30;
display:flex;flex-direction:column;gap:5px;align-items:center;pointer-events:none}
.tst{background:rgba(8,12,10,.94);border:1px solid var(--line2);
border-left:2px solid var(--amber);border-radius:2px;padding:8px 13px;font-size:12.5px;
animation:up 2.6s ease forwards;max-width:86vw;text-align:center;
box-shadow:0 4px 18px rgba(0,0,0,.6)}
@keyframes up{0%{opacity:0;transform:translateY(10px)}10%{opacity:1;transform:none}
78%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
#flash{position:fixed;inset:0;z-index:15;pointer-events:none;
background:rgba(150,20,10,0);transition:background .18s}
#loading{position:fixed;inset:0;z-index:50;display:flex;align-items:center;
justify-content:center;background:var(--ink);color:var(--dim);font-size:13px;
letter-spacing:2px}
@media (max-width:360px){.ring{width:39px}.ring svg{width:35px;height:35px}
 .ring .rv{top:9px;font-size:11px}.pTime{font-size:19px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style>
/* ===== หมวดหมู่ในหน้าคราฟ ===== */
.cat{display:flex;align-items:center;gap:8px;margin:14px 0 6px}
.cat .t{font-size:9.5px;letter-spacing:2.6px;color:var(--gold);white-space:nowrap}
.cat .r{flex:1;height:1px;background:linear-gradient(90deg,rgba(201,162,39,.35),transparent)}
.need{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.ing{font-size:10px;padding:2px 7px;border-radius:2px;border:1px solid var(--line2);
color:var(--dim);letter-spacing:.2px;background:rgba(0,0,0,.25)}
.ing.ok{color:#a9c288;border-color:rgba(138,168,99,.45);background:rgba(138,168,99,.10)}
.ing.no{color:#c98a7a;border-color:rgba(176,74,47,.4);background:rgba(176,74,47,.08)}
.ing b{font-weight:600}
.sub2{font-size:9.5px;color:#5f6d64;margin-top:3px;letter-spacing:.2px}

/* ===== หน้าสถานะตัวละคร ===== */
.expWrap{margin:10px 0 4px}
.expTop{display:flex;justify-content:space-between;font-size:10px;
letter-spacing:1.6px;color:var(--dim);margin-bottom:4px}
.expTop b{color:var(--gold);letter-spacing:.5px;font-size:11px}
.expBar{height:7px;border-radius:2px;overflow:hidden;position:relative;
background:#0a0e0c;border:1px solid var(--line2)}
.expBar i{display:block;height:100%;
background:linear-gradient(90deg,#8a6a1e,var(--gold),#f0d98a);
box-shadow:0 0 10px rgba(201,162,39,.5);transition:width .4s ease}
.expBar::after{content:'';position:absolute;inset:0;pointer-events:none;
background:repeating-linear-gradient(90deg,transparent 0 15px,rgba(0,0,0,.5) 15px 16px)}

.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:10px 0 2px}
.slot{background:linear-gradient(180deg,var(--panel),rgba(12,17,14,.7));
border:1px solid var(--line);border-radius:3px;padding:8px 4px 7px;text-align:center;
cursor:pointer;position:relative;overflow:hidden;transition:border-color .15s}
.slot:active{background:var(--panel2)}
.slot.full{border-color:var(--line2)}
.slot.rr-l{border-color:rgba(224,176,60,.6);
background:linear-gradient(180deg,rgba(201,162,39,.14),rgba(12,17,14,.7))}
.slot.rr-e{border-color:rgba(177,132,216,.5)}
.slot.rr-r{border-color:rgba(106,168,216,.5)}
.slot.rr-u{border-color:rgba(143,191,106,.5)}
.slot svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.5;
stroke-linecap:round;stroke-linejoin:round;color:#4d5a51;margin-bottom:3px}
.slot.full svg{color:#8a9a8c}
.slot .sn{font-size:8.5px;letter-spacing:1.2px;color:var(--dim);line-height:1.2}
.slot .sv{font-size:9.5px;line-height:1.3;margin-top:2px;color:#d8d3c0;
white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .empty{font-size:9px;color:#3f4a44;margin-top:2px}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;margin:10px 0 2px}
.stat{display:flex;align-items:baseline;gap:6px;font-size:11.5px;
padding:5px 8px;background:rgba(255,255,255,.02);border-radius:2px;
border-left:2px solid var(--line2)}
.stat .k{color:var(--dim);flex:1;font-size:10.5px;letter-spacing:.3px}
.stat .v{font-variant-numeric:tabular-nums;color:#e6e0cc;font-weight:600}
.stat .p{color:var(--moss);font-size:10px}

/* ===== เอฟเฟกต์ตอนคราฟ ===== */
#mFx{position:fixed;inset:0;z-index:40;display:none;align-items:center;
justify-content:center;background:rgba(3,5,4,.90)}
#mFx.on{display:flex}
.fxWrap{position:relative;width:230px;height:230px;display:flex;
align-items:center;justify-content:center;flex-direction:column}
.fxRing{position:absolute;width:120px;height:120px;border-radius:50%;
border:1px solid rgba(201,162,39,.35);opacity:0}
.fxRing.go{animation:ringOut 1.1s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes ringOut{0%{opacity:.9;transform:scale(.35)}100%{opacity:0;transform:scale(2.2)}}
.fxCore{width:74px;height:74px;border-radius:50%;position:relative;
background:radial-gradient(circle at 50% 45%,#3a2d12,#12100a 70%);
border:1px solid rgba(201,162,39,.4);display:flex;align-items:center;justify-content:center}
.fxCore.hit{animation:coreHit .22s ease}
@keyframes coreHit{0%{transform:scale(1)}35%{transform:scale(1.22);
box-shadow:0 0 34px rgba(255,190,80,.75)}100%{transform:scale(1)}}
.fxCore svg{width:34px;height:34px;stroke:#d9a441;fill:none;stroke-width:1.5;
stroke-linecap:round;stroke-linejoin:round}
.fxCore.done{animation:coreDone .7s ease forwards}
@keyframes coreDone{0%{transform:scale(1)}45%{transform:scale(1.5);
box-shadow:0 0 60px rgba(255,215,130,.95)}100%{transform:scale(1.15);
box-shadow:0 0 26px rgba(201,162,39,.5)}}
.spark{position:absolute;left:50%;top:50%;width:3px;height:3px;border-radius:50%;
background:#ffd98a;box-shadow:0 0 7px #ffb347;pointer-events:none;
animation:sparkFly .62s cubic-bezier(.15,.7,.4,1) forwards}
@keyframes sparkFly{0%{transform:translate(-50%,-50%) scale(1);opacity:1}
100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.15);opacity:0}}
.fxSub{position:absolute;bottom:26px;font-size:10px;letter-spacing:3.4px;
color:var(--dim);text-align:center}
.fxName{position:absolute;bottom:48px;font-size:15px;font-weight:600;
letter-spacing:.5px;opacity:0;text-align:center;width:100%;padding:0 6px}
.fxName.show{animation:nameIn .5s ease forwards}
@keyframes nameIn{0%{opacity:0;transform:translateY(9px) scale(.94)}
100%{opacity:1;transform:none}}
.shakeMe{animation:shk .2s ease}
@keyframes shk{0%,100%{transform:none}25%{transform:translate(-3px,2px)}
75%{transform:translate(3px,-2px)}}

/* ===== หัวหน้าต่างติดหนึบ + ปุ่มปิด ===== */
.sheet{position:relative}
.sheet::before{display:none!important}
.sheetHead{position:sticky;top:0;z-index:6;margin:0 -14px;padding:0 54px 0 14px;
background:linear-gradient(180deg,#0f1614 84%,rgba(15,22,20,.0))}
.sheetHead::before{content:'';display:block;width:38px;height:3px;border-radius:2px;
background:var(--line2);margin:9px auto 11px}
.xBtn{position:absolute;top:14px;right:0;width:36px;height:36px;flex:0 0 auto;padding:0;
display:flex;align-items:center;justify-content:center;border-radius:50%;
background:rgba(255,255,255,.05);border:1px solid var(--line2);z-index:7}
.xBtn svg{width:15px;height:15px;stroke:var(--bone);fill:none;stroke-width:1.9;
stroke-linecap:round}
.xBtn:active{background:rgba(176,74,47,.25);border-color:rgba(176,74,47,.6)}
.xBtn:focus-visible{outline:1px solid var(--amber);outline-offset:2px}

/* ===== วงแหวนสถานะ: จัดตัวเลขให้อยู่กลางวงพอดี ===== */
.rings{gap:1px}
.ring{position:relative;width:47px;text-align:center}
.ringSvg{position:relative;width:44px;height:44px;margin:0 auto}
.ring svg{width:44px;height:44px;transform:rotate(-90deg);display:block}
.ring circle{stroke-width:2.8}
.ring .rv{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
font-size:12px;font-weight:600;line-height:1;letter-spacing:-.2px;
font-variant-numeric:tabular-nums;color:#e8e2ce;margin:0}
.ring .rl{font-size:8.5px;letter-spacing:1.3px;color:var(--dim);margin-top:2px}
@media (max-width:370px){.ring{width:42px}.ringSvg{width:39px;height:39px}
 .ring svg{width:39px;height:39px}.ring .rv{font-size:11px}}

/* ================= ฉากต่อสู้ ================= */
.scene{position:relative;height:212px;margin:11px -14px 10px;overflow:hidden;
border-top:1px solid var(--line2);border-bottom:1px solid var(--line2);
background:radial-gradient(ellipse 78% 62% at 50% 84%,#1d2620 0%,#111815 46%,#080c0a 100%)}
.scene.night{background:radial-gradient(ellipse 78% 62% at 50% 84%,#141c26 0%,#0b1118 48%,#05080c 100%)}
.scene.rain{background:radial-gradient(ellipse 78% 62% at 50% 84%,#18222a 0%,#0c1318 48%,#060a0d 100%)}
.scene.fog{background:radial-gradient(ellipse 78% 62% at 50% 84%,#2a302e 0%,#1a201e 48%,#101412 100%)}
.scene.boss{background:radial-gradient(ellipse 78% 62% at 50% 84%,#2a1c33 0%,#150e1c 48%,#08050c 100%)}
.scene::before{content:'';position:absolute;left:8%;right:8%;bottom:34px;height:1px;
background:linear-gradient(90deg,transparent,rgba(180,190,175,.18),transparent)}
.scene::after{content:'';position:absolute;inset:0;pointer-events:none;
background:linear-gradient(180deg,rgba(0,0,0,.45),transparent 22%,transparent 74%,rgba(0,0,0,.5))}
.scene.shk{animation:sceneShake .22s ease}
@keyframes sceneShake{0%,100%{transform:none}
25%{transform:translate(-4px,2px)}75%{transform:translate(4px,-2px)}}

.slash{position:absolute;inset:0;pointer-events:none;z-index:3;opacity:0}
.slash.go{opacity:1}
.slash::before,.slash::after{content:'';position:absolute;left:16%;width:68%;height:2.5px;
border-radius:2px;background:linear-gradient(90deg,transparent,#fff8e0 45%,transparent);
transform:rotate(26deg) scaleX(0);transform-origin:left center;opacity:0}
.slash::before{top:36%}
.slash::after{top:52%;transform:rotate(20deg) scaleX(0)}
.slash.go::before{animation:slashA .3s ease}
.slash.go::after{animation:slashA .3s ease .07s}
@keyframes slashA{0%{transform:rotate(24deg) scaleX(0);opacity:0}
25%{opacity:1}100%{transform:rotate(24deg) scaleX(1);opacity:0}}

.dmgN{position:absolute;font-weight:700;font-size:21px;line-height:1;
color:#ffe6a8;font-variant-numeric:tabular-nums;
text-shadow:0 2px 0 #3d2c08,0 0 12px rgba(255,190,80,.55);
animation:dmgUp 1s cubic-bezier(.2,.8,.4,1) forwards}
.dmgN.crit{font-size:30px;color:#fff3cd;
text-shadow:0 2px 0 #4a3208,0 0 20px rgba(255,205,90,.9)}
.dmgN.enemy{font-size:19px;color:#ff9f80;
text-shadow:0 2px 0 #3d1006,0 0 12px rgba(200,60,30,.5)}
@keyframes dmgUp{0%{opacity:0;transform:translateY(8px) scale(.6)}
18%{opacity:1;transform:translateY(-3px) scale(1.18)}
34%{transform:translateY(-8px) scale(1)}
100%{opacity:0;transform:translateY(-46px) scale(.95)}}

/* ===== ศัตรูหลายตัวในฉาก ===== */
.mobRow{position:absolute;left:0;right:0;bottom:30px;display:flex;
justify-content:center;align-items:flex-end;gap:2px;z-index:2}
.mobBox{position:relative;display:flex;flex-direction:column;align-items:center;
cursor:pointer;padding:0 2px;transition:filter .2s}
.mobRow.n1 .mobBox img{max-height:158px}
.mobRow.n2 .mobBox img{max-height:132px}
.mobRow.n3 .mobBox img{max-height:112px}
.mobRow.n4 .mobBox img{max-height:96px}
.mobBox img{width:auto;display:block;image-rendering:pixelated;
image-rendering:-moz-crisp-edges;animation:breathe 2.8s ease-in-out infinite;
filter:drop-shadow(0 5px 8px rgba(0,0,0,.55))}
.mobBox:nth-child(2) img{animation-delay:-.7s}
.mobBox:nth-child(3) img{animation-delay:-1.4s}
.mobBox:nth-child(4) img{animation-delay:-2.1s}
.mobBox.bossMob img{max-height:180px!important;
filter:drop-shadow(0 0 16px rgba(177,132,216,.55)) drop-shadow(0 6px 9px rgba(0,0,0,.6))}
.mobBox:not(.sel):not(.dead){filter:brightness(.62) saturate(.7)}
.mobBox.sel::after{content:'';position:absolute;top:-4px;left:50%;margin-left:-6px;
width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;
border-top:8px solid var(--amber);animation:pointBob .9s ease-in-out infinite}
@keyframes pointBob{50%{transform:translateY(4px)}}
.mobHp{width:70%;max-width:86px;height:4px;border-radius:2px;overflow:hidden;
background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.10);margin-bottom:4px}
.mobHp i{display:block;height:100%;background:linear-gradient(90deg,#7d2c1a,#c25a3a);
transition:width .3s}
.mobTag{font-size:8.5px;color:#b9c2b6;margin-top:3px;letter-spacing:.2px;
text-shadow:0 1px 2px #000;white-space:nowrap;max-width:96px;overflow:hidden;
text-overflow:ellipsis;text-align:center}
.mobTag b{color:#d9a441;font-weight:600}
.mobBox.dead{pointer-events:none;filter:none}
.mobBox.dead img{animation:mobDie .9s ease forwards}
.mobBox.dead .mobHp,.mobBox.dead .mobTag{opacity:0;transition:opacity .5s}
.mobBox .dmgLayer{position:absolute;left:0;right:0;top:-14px;bottom:0;
pointer-events:none;z-index:5}
.mobShadow{width:56px;height:11px;margin-top:-3px;border-radius:50%;
background:radial-gradient(ellipse,rgba(0,0,0,.6),transparent 72%);
animation:shadowPulse 2.8s ease-in-out infinite}
.mobBox.hit img{animation:mobHit .34s ease}
.mobBox.dead .mobShadow{animation:none;opacity:0;transition:opacity .6s}
#fScene>.dmgN{z-index:6}
@media (max-width:370px){
 .mobRow.n1 .mobBox img{max-height:134px}
 .mobRow.n2 .mobBox img{max-height:112px}
 .mobRow.n3 .mobBox img{max-height:94px}
 .mobRow.n4 .mobBox img{max-height:80px}
 .mobBox.bossMob img{max-height:152px!important}}

/* ===== ป้ายโหมดอัตโนมัติ ===== */
#autoChip{position:fixed;left:50%;transform:translateX(-50%);bottom:64px;z-index:9;
display:none;align-items:center;gap:7px;padding:7px 14px;border-radius:20px;
background:rgba(10,16,12,.94);border:1px solid rgba(138,168,99,.55);
color:#cfe0b6;font-size:12px;letter-spacing:.4px;cursor:pointer;
box-shadow:0 4px 16px rgba(0,0,0,.6)}
#autoChip.on{display:flex}
#autoChip .dot{width:7px;height:7px;border-radius:50%;background:var(--moss);
box-shadow:0 0 8px var(--moss);animation:autoPulse 1.2s ease-in-out infinite}
@keyframes autoPulse{50%{opacity:.25;transform:scale(.7)}}

/* ================= หน้าจอจบการเดินทาง ================= */
#mDead{align-items:center;justify-content:center;padding:16px;
background:radial-gradient(ellipse at 50% 42%,rgba(70,12,6,.55),rgba(3,5,4,.96) 62%)}
.deadWrap{width:100%;max-width:420px;max-height:92vh;overflow-y:auto}
.deadFrame{position:relative;padding:26px 20px 20px;text-align:center;
background:linear-gradient(180deg,rgba(20,14,12,.96),rgba(8,10,9,.98));
border:1px solid rgba(176,74,47,.45);border-radius:4px;
box-shadow:0 0 0 1px rgba(0,0,0,.6),0 20px 60px rgba(0,0,0,.8);
animation:deadIn .55s cubic-bezier(.2,.8,.3,1)}
@keyframes deadIn{0%{opacity:0;transform:translateY(18px) scale(.97)}100%{opacity:1}}
.deadFrame::before,.deadFrame::after{content:'';position:absolute;left:18px;right:18px;height:1px;
background:linear-gradient(90deg,transparent,rgba(201,162,39,.5),transparent)}
.deadFrame::before{top:12px}.deadFrame::after{bottom:12px}
.deadEye{font-size:10px;letter-spacing:6px;color:var(--rust);margin-bottom:10px}
.deadCause{font-size:15px;color:#e8ddd2;line-height:1.5;margin-bottom:14px;font-weight:600}
.deadHero{display:flex;align-items:flex-end;justify-content:center;gap:16px;margin:6px 0 10px}
.deadKiller{display:flex;flex-direction:column;align-items:center;gap:4px}
.deadKiller img{height:96px;width:auto;image-rendering:pixelated;
filter:grayscale(.85) brightness(.62) drop-shadow(0 4px 8px rgba(0,0,0,.7))}
.deadKiller div{font-size:9px;color:#7d6a63;letter-spacing:.4px;max-width:110px;line-height:1.3}
.deadDays{display:flex;flex-direction:column;align-items:center}
.deadDays b{font-size:62px;line-height:.9;font-weight:700;color:#f0dfae;
font-variant-numeric:tabular-nums;
text-shadow:0 0 26px rgba(201,162,39,.45),0 3px 0 rgba(0,0,0,.6)}
.deadDays span{font-size:10px;letter-spacing:3px;color:var(--dim);margin-top:8px}
.deadWhen{font-size:10.5px;color:var(--dim);line-height:1.6;margin:10px 0 14px;
padding-top:12px;border-top:1px solid rgba(255,255,255,.07)}
.deadStats{display:grid;grid-template-columns:1fr 1fr;gap:1px;
background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.05);margin-bottom:12px}
.dStat{display:flex;justify-content:space-between;align-items:baseline;gap:8px;
padding:9px 11px;background:#0d1210;font-size:11.5px}
.dStat span{color:var(--dim);font-size:10.5px}
.dStat b{color:#e6e0cc;font-variant-numeric:tabular-nums;font-weight:600}
.deadNote{font-size:10.5px;color:#8a9a8c;line-height:1.6;margin-bottom:16px;min-height:1em}
.deadBtn{width:100%;padding:14px;font-size:14px;letter-spacing:1px;border-radius:3px;
color:#f4e7c0;border:1px solid rgba(201,162,39,.6);
background:linear-gradient(180deg,rgba(201,162,39,.22),rgba(201,162,39,.06));
box-shadow:inset 0 1px 0 rgba(255,235,180,.14)}
.deadBtn:active{background:rgba(201,162,39,.3)}
@media (max-width:370px){.deadDays b{font-size:52px}.deadKiller img{height:80px}
 .deadFrame{padding:22px 15px 16px}}
</style>

</head>

const MG={
 bind :{n:'วัสดุมัด',   list:['tape','rope','cloth','wire','sinew']},
 wood :{n:'ไม้',        list:['bamboo','wood']},
 metal:{n:'โลหะ',       list:['nail','metal','spring','gear']},
 fabric:{n:'ผ้า',       list:['cloth','tarp','leather']},
 fire :{n:'เชื้อไฟ',    list:['lighter','fuel','alcohol']},
 tech :{n:'ชิ้นส่วนกลไก',list:['wire','spring','gear','battery']},
};
const isG=k=>!!MG[k];
const gName=k=>isG(k)?MG[k].n:ITEMS[k].n;
/* อยู่ที่ฐานและมีตู้เก็บของ = หยิบวัสดุจากตู้มาใช้ได้เลย ไม่ต้องถอนออกมาก่อน */
const storeLinked=()=>!!S.locker&&world&&dist(S.x,S.y,world.base.x,world.base.y)<90;
const haveK=k=>(S.bag[k]||0)+(storeLinked()?(S.store[k]||0):0);
const inStoreK=k=>storeLinked()?(S.store[k]||0):0;
function payK(k,n){
  let left=n;
  const fromBag=Math.min(S.bag[k]||0,left);
  if(fromBag>0){useUp(k,fromBag);left-=fromBag;}
  if(left>0&&storeLinked()){
    const t=Math.min(S.store[k]||0,left);
    if(t>0){S.store[k]-=t;if(S.store[k]<=0)delete S.store[k];left-=t;}
  }
  return n-left;
}
function gHave(k){
  if(!isG(k))return haveK(k);
  return MG[k].list.reduce((a,x)=>a+haveK(x),0);
}
function gFromStore(k){
  if(!isG(k))return inStoreK(k);
  return MG[k].list.reduce((a,x)=>a+inStoreK(x),0);
}
function gDetail(k){
  if(!isG(k))return '';
  const has=MG[k].list.filter(x=>haveK(x));
  return has.length?has.map(x=>ITEMS[x].n+' '+haveK(x)).join(', '):'ยังไม่มีสักอย่าง';
}
function gPay(k,n){
  if(!isG(k)){const got=payK(k,n);return got>0?[[k,got]]:[];}
  const used=[];let left=n;
  for(const x of MG[k].list){
    if(left<=0)break;
    const have=haveK(x);if(!have)continue;
    const take=Math.min(have,left);
    const got=payK(x,take);
    if(got>0){left-=got;used.push([x,got]);}
  }
  return used;
}

  let tot=0;list.forEach(x=>tot+=x[1]);

  const r=rngOf('gen'+seed);

    name:b.n,area:b.a,isBase:!!b.base,searched:0,lastSearch:-999,zone:zoneOf(b.x,b.y)}));
  const cell=40,grid={};
  const key=(x,y)=>Math.floor(x/cell)+'_'+Math.floor(y/cell);
  const put=b=>{const k=key(b.cx,b.cy);(grid[k]=grid[k]||[]).push(b);};
  const near=(x,y,rad)=>{const out=[];
    const c0=Math.floor((x-rad)/cell),c1=Math.floor((x+rad)/cell),
          d0=Math.floor((y-rad)/cell),d1=Math.floor((y+rad)/cell);
    for(let i=c0;i<=c1;i++)for(let j=d0;j<=d1;j++){const g=grid[i+'_'+j];if(g)out.push(...g);}

      const nx=-(by-ay)/L,ny=(bx-ax)/L;
      for(let d=gap*.5;d<L;d+=gap*(.7+r()*.7)){
        const side=r()<.5?1:-1,off=(rd.c>=2?16:10)+r()*22,t=d/L;
        const cx=ax+(bx-ax)*t+nx*off*side, cy=ay+(by-ay)*t+ny*off*side;
        if(cx<10||cy<10||cx>W-10||cy>H-10)continue;
        if(near(cx,cy,26).some(b=>dist(b.cx,b.cy,cx,cy)<24))continue;
        const q=r(),big=q<.10;

        const bw=big?14+r()*20:7+r()*11, bh=big?10+r()*14:6+r()*9;
        const ang=Math.atan2(by-ay,bx-ax)+(r()-.5)*.35,c=Math.cos(ang),s=Math.sin(ang);
        const P=[[-bw,-bh],[bw,-bh],[bw,bh],[-bw,bh]].map(p=>[cx+p[0]*c-p[1]*s,cy+p[0]*s+p[1]*c]);
        const pool=SHOPNAME[type];
        const b={id:'g'+(n++),cx,cy,pts:P,type,
          name:pool?pool[Math.floor(r()*pool.length)]:null,area:Math.round(bw*bh*4),
          isBase:false,searched:0,lastSearch:-999,zone:zoneOf(cx,cy)};
        builds.push(b);put(b);
      }
    }
  });
  // รับประกันว่าร้านหายากมีอยู่จริงในแผนที่เสมอ
  const MINSHOP={gunshop:2,police:3,pharmacy:3,convenience:6,hardware:6,bus:2,market:4};
  const cnt={};builds.forEach(b=>cnt[b.type]=(cnt[b.type]||0)+1);
  const cand=builds.filter(b=>!b.isBase&&(b.type==='house'||b.type==='shop')&&b.zone>=2);
  for(const t in MINSHOP){
    let need=MINSHOP[t]-(cnt[t]||0);
    while(need>0&&cand.length){
      const b=cand.splice(Math.floor(r()*cand.length),1)[0];
      b.type=t;
      const pool=SHOPNAME[t];
      if(pool)b.name=pool[Math.floor(r()*pool.length)];
      need--;
    }
  }
  MAPDATA.pois.forEach((p,i)=>{
    if(near(p.x,p.y,30).some(b=>dist(b.cx,b.cy,p.x,p.y)<22))return;
    const s=9;
    const b={id:'p'+i,cx:p.x,cy:p.y,type:p.t,name:p.n,area:200,searched:0,lastSearch:-999,
      isBase:false,zone:zoneOf(p.x,p.y),
      pts:[[p.x-s,p.y-s],[p.x+s,p.y-s],[p.x+s,p.y+s],[p.x-s,p.y+s]]};
    builds.push(b);put(b);
  });
  return{seed,builds,roads:MAPDATA.roads,water:MAPDATA.water,land:MAPDATA.land,
   base:{x:BASE.x,y:BASE.y},grid,near};
}

const nowMin=()=>S.day*1440+S.min;
/* ===== บัพจากอาหาร ===== */
function addBuff(b,hours){
  S.buffs=(S.buffs||[]).filter(x=>x.n!==b.n);
  S.buffs.push({n:b.n,atk:b.atk||0,def:b.def||0,stam:b.stam||0,quiet:b.quiet||0,
    find:b.find||0,until:nowMin()+hours*60});
}
function pruneBuffs(){const t=nowMin();S.buffs=(S.buffs||[]).filter(b=>b.until>t);}
function buffSum(k){const t=nowMin();
  return (S.buffs||[]).reduce((a,b)=>a+(b.until>t?(b[k]||0):0),0);}
/* ===== ความชำนาญอาวุธ ===== */
const MASNAME={knife:'มีดสั้น',club:'ไม้/กระบอง',axe:'ขวาน',blade:'ดาบ/มีดพร้า',
 spear:'หอก',bow:'ธนู',gun:'ปืน'};
const MKEYS=Object.keys(MASNAME);
function masLv(k){return Math.min(10,Math.floor(Math.sqrt((S.mastery[k]||0)/8)));}
function masNeed(k){const l=masLv(k)+1;return 8*l*l;}
function masGain(k,n){if(!k)return;const b=masLv(k);S.mastery[k]=(S.mastery[k]||0)+n;
  if(masLv(k)>b)toast('ความชำนาญ'+(MASNAME[k]||k)+' ขึ้นระดับ '+masLv(k));}
const masDmg=k=>1+masLv(k)*.035;      // แรงขึ้น 3.5% ต่อระดับ
const masCrit=k=>masLv(k)*.015;       // คริเพิ่ม 1.5% ต่อระดับ
const masSteady=k=>masLv(k)*.02;      // ความเสียหายสวิงน้อยลง = แม่นขึ้น
/* ===== ทักษะคราฟ ===== */
function craftLv(){return Math.min(10,Math.floor(Math.sqrt((S.craftExp||0)/10)));}
function craftNeed(){const l=craftLv()+1;return 10*l*l;}
function craftGain(n){const b=craftLv();S.craftExp=(S.craftExp||0)+n;
  if(craftLv()>b)toast('ทักษะช่างขึ้นระดับ '+craftLv()+' — ของที่ทำจะดีขึ้น');}
const wornList=()=>SLOTS.map(s=>S.gear[s.k]).filter(Boolean);
const gsum=k=>wornList().reduce((a,g)=>a+(g[k]||0),0);
const totDef=()=>S.defB*2+gsum('def')+buffSum('def');
const totCarry=()=>Math.max(8,S.carry+S.carryB+gsum('carry'));
const totQuiet=()=>S.quietB+gsum('quiet')+buffSum('quiet');
const totFind=()=>S.searchB+gsum('find')+buffSum('find');
const totCool=()=>gsum('cool');
const totInf=()=>gsum('inf');
const totStam=()=>gsum('stam')+buffSum('stam');
const wepAtk=()=>S.eq?Math.round(S.eq.atk*masDmg(S.eq.key)):4;
const totAtk=()=>wepAtk()+S.atkB*2+buffSum('atk');
function bagWeight(){let w=0;for(const k in S.bag)w+=ITEMS[k].w*S.bag[k];
  S.weapons.forEach(x=>w+=x.w);S.gearList.forEach(x=>w+=x.w);
  wornList().forEach(x=>{if(x.from)w+=x.w;});
  return Math.round(w*10)/10;}
const isNight=()=>{const h=S.min/60;return h<6||h>=18.5;};
const clock=()=>String(Math.floor(S.min/60)).padStart(2,'0')+':'+String(Math.floor(S.min%60)).padStart(2,'0');
const expNeed=()=>S.lv*45;

function record(k,n,src){S.found[k]=(S.found[k]||0)+n;
  S.feed.unshift({t:'i',k,n,src,d:S.day,c:clock()});if(S.feed.length>120)S.feed.pop();}
function recordW(w,src){S.foundW.unshift({n:w.n,rar:w.rar,atk:w.atk||0,src,d:S.day,c:clock()});
  if(S.foundW.length>60)S.foundW.pop();
  S.feed.unshift({t:'w',k:w.n,rar:w.rar,src,d:S.day,c:clock()});
  if(S.feed.length>120)S.feed.pop();}
function collect(tbl,src,force){
  const out=[];
  for(const k in tbl){const q=tbl[k];if(q<=0)continue;
    if(!force&&bagWeight()+ITEMS[k].w*q>totCarry()){out.push({k,n:q,ok:false});continue;}
    addItem(k,q);record(k,q,src);out.push({k,n:q,ok:true});}
  return out;
}

function mobDrop(m){
  const base=m.c==='a'?DROP_A:(m.c==='f'?DROP_F:DROP_H);
  return Object.assign({},base,m.d||{});
}
function makeMob(zone,btype){
  const r=Math.random;
  let pool=MOBS.filter(m=>m.t<=zone+1&&m.t>=zone-1);
  if(!pool.length)pool=MOBS.filter(m=>m.t<=zone+1);
  if(!pool.length)pool=MOBS.slice();
  const w=pool.map(m=>{
    let x=1;
    if(btype&&m.pl&&m.pl.indexOf(btype)>=0)x=7;
    else if(btype&&m.c!=='h')x=.45;
    if(m.c==='f')x*=(btype&&m.pl.indexOf(btype)>=0)?1.2:.25;
    if(m.t===zone)x*=1.6;
    return x;});
  let tot=0;w.forEach(x=>tot+=x);
  let v=r()*tot,pickd=pool[0];
  for(let i=0;i<pool.length;i++){v-=w[i];if(v<=0){pickd=pool[i];break;}}
  return spawnFrom(pickd,zone);
}
function spawnFrom(m,zone){
  const r=Math.random;
  const lv=Math.max(1,zone*3+Math.floor(r()*5)+(isNight()?3:0)+(m.t-zone)*2);
  const hp=Math.round(m.hp*(1+lv*.10));
  return{name:m.n,spr:m.s,cat:m.c,passive:!!m.passive,tbl:mobDrop(m),lv,hp,hpMax:hp,
   atk:Math.round(m.atk*(1+lv*.05)),arm:(m.arm||0)+Math.floor(lv/6),
   spd:m.spd,noiseMul:m.passive?.4:1,regen:0,thorn:0,infMul:m.inf||.2,zone,
   nightMul:1,summon:0,exp:m.passive?Math.round(4+lv):8+lv*3+(m.t*4),base:m};
}

function newGame(seed){
  const sd=seed||('sakae'+Date.now());
  gearSeq=0;
  world=buildWorld(sd);
  Object.assign(S,{day:1,min:7*60,hp:100,hpMax:100,st:100,stMax:100,food:100,water:100,
   inf:0,lv:1,exp:0,sp:0,atkB:0,defB:0,searchB:0,carryB:0,quietB:0,
   x:world.base.x+40,y:world.base.y+70,tx:null,ty:null,bag:{},weapons:[],eq:null,
   gearList:[],gear:{head:null,body:null,hand:null,feet:null,charm:null},
   rev:[],wx:'clear',wxUntil:0,killed:0,searched:0,walked:0,bossKill:0,crafted:0,
   stove:false,dead:false,bosses:[],found:{},foundW:[],feed:[],killLog:{},
   mastery:{},craftExp:0,buffs:[],campUntil:-1,scrapped:0,
   locker:false,store:{},storeW:[],storeG:[],auto:false,autoZone:2,lastEnc:-999,craftQty:1});
  addItem('water',2);addItem('noodle',2);addItem('bandage',1);addItem('cloth',2);
  const w0=newWeapon('club',0);S.weapons.push(w0);S.eq=w0;
  const g0=newGear('sandal',0);S.gearList.push(g0);S.gear.feet=g0;
  const r=rngOf('bs'+sd);
  const big=world.builds.filter(b=>!b.isBase&&b.area>250).sort((a,b)=>b.area-a.area).slice(0,60);
  const n=ri(r,4,8);
  for(let i=0;i<n&&big.length;i++){
    const b=big.splice(Math.floor(r()*big.length),1)[0];
    const bs=makeBoss(sd+'_'+i,b.zone);
    if(i>=n-2){bs.locked=true;bs.unlockDay=ri(r,12,22);}
    bs.home=b.id;S.bosses.push(bs);
  }
  markSeen(1);
  toast('ตื่นขึ้นที่ลานวัดสะแก · ไม่มีเสียงคนเลยสักเสียง');
  saveGame();
}

/* ================= เวลา ================= */
function advance(mins){
  if(S.dead)return;
  const b4=S.day;S.min+=mins;
  while(S.min>=1440){S.min-=1440;S.day++;onNewDay();}
  const wm=WX[S.wx];
  S.food=Math.max(0,S.food-mins*.030);
  S.water=Math.max(0,S.water-mins*.042*wm.thirst*(1-Math.min(.5,totCool()*.09)));
  if(S.food<=0)S.hp-=mins*.045;
  if(S.water<=0)S.hp-=mins*.075;
  if(S.inf>0){
    if(S.inf<25&&S.food>50&&S.water>50){
      S.inf=Math.max(0,S.inf-mins*.011);      // แผลตื้น ๆ ร่างกายสู้เองได้ถ้าไม่อดอยาก
      if(S.inf<=0)toast('แผลอักเสบหายเองแล้ว');
    }else{
      const was=S.inf;
      S.inf=Math.min(100,S.inf+mins*.022);
      if(was<60&&S.inf>=60)toast('เชื้อลุกลามเกินครึ่ง — เลือดไม่ฟื้นเองอีกแล้ว');
      if(was<100&&S.inf>=100)toast('เชื้อเต็มขั้น — ต้องหายาปฏิชีวนะด่วน');
      if(S.inf>=100)S.hp-=mins*.12;
    }
  }
  if(S.food>25&&S.water>25&&S.inf<60)S.hp=Math.min(S.hpMax,S.hp+mins*.010);
  pruneBuffs();
  if(S.wxUntil<=S.day*1440+S.min)rollWeather();
  if(S.hp<=0)die(deathCause());
  if(b4!==S.day)saveGame();
  updHUD();
}
function onNewDay(){
  const r=rngOf('mv'+world.seed+S.day);
  S.bosses.forEach(b=>{
    if(b.dead)return;
    if(b.locked&&S.day>=b.unlockDay){b.locked=false;toast('มีอะไรบางอย่างตื่นขึ้นที่ไหนสักแห่ง');}
    if(b.roam&&!b.locked&&r()<.5){
      const c=world.builds.filter(x=>!x.isBase&&x.area>200);
      if(c.length)b.home=c[Math.floor(r()*c.length)].id;}
  });
  toast('วันที่ '+S.day);
}
function rollWeather(){
  const r=Math.random();
  S.wx=r<.45?'clear':r<.68?'hot':r<.87?'rain':'fog';
  S.wxUntil=S.day*1440+S.min+(180+Math.random()*300);
}
function sightRadius(){
  let r=95;
  if(S.wx==='fog')r=50;else if(isNight())r=62;else if(S.wx==='rain')r=78;
  return r;
}
function markSeen(force){
  const r=sightRadius(),last=S.rev[S.rev.length-1];
  if(!force&&last&&dist(last[0],last[1],S.x,S.y)<18&&last[2]>=r)return;
  S.rev.push([Math.round(S.x),Math.round(S.y),r]);
  if(S.rev.length>6000)S.rev.splice(0,1500);
}

/* ================= เดิน ================= */
let lastT=0;
function step(t){
  const dt=Math.min(50,t-lastT)/1000;lastT=t;
  if(S.auto&&!S.dead)autoTick(t);
  if(!S.dead&&S.tx!==null&&!isModal()){
    const dx=S.tx-S.x,dy=S.ty-S.y,d=Math.hypot(dx,dy);
    if(d<3)S.tx=S.ty=null;
    else{
      let sp=40;if(S.st<=0)sp*=.45;if(bagWeight()>totCarry())sp*=.6;
      const m=Math.min(d,sp*dt);
      S.x+=dx/d*m;S.y+=dy/d*m;S.walked+=m;
      const stBefore=S.st;
      S.st=Math.max(0,S.st-m*.055*(1-Math.min(.45,totStam()*.09)));
      if(stBefore>0&&S.st<=0)toast('พลังหมด เดินช้าลงมาก — พักในอาคาร หรือดื่มกาแฟ/ชูกำลัง');
      advance(m*.02);markSeen();
      if(nowMin()-(S.lastEnc||-999)>25&&Math.random()<m*encChance()/340)encounter();
    }
  }
  draw();requestAnimationFrame(step);
}
const isModal=()=>document.getElementById('mDead').classList.contains('on')||
  document.getElementById('mSheet').classList.contains('on')||
  document.getElementById('mFight').classList.contains('on')||
  document.getElementById('mFx').classList.contains('on');
function encChance(){
  let c=.8+zoneOf(S.x,S.y)*.5;
  if(isNight())c*=1.9;
  if(S.wx==='fog')c*=1.3;if(S.wx==='rain')c*=.75;
  return Math.max(.2,c*(1-Math.min(.6,totQuiet()*.06)));
}
function encounter(){S.tx=S.ty=null;S.lastEnc=nowMin();const z=zoneOf(S.x,S.y);startFight(spawnGroup(z,null),null);}

const RCOL=['#1f211d','#232520','#292b26','#33352c'],RW=[3,5,8,13];
function draw(){
  const w=innerWidth,h=innerHeight,z=cam.z;
  g2.fillStyle='#0e1310';g2.fillRect(0,0,w,h);
  g2.save();g2.translate(w/2,h/2);g2.scale(z,z);g2.translate(-S.x,-S.y);
  const vr=Math.max(w,h)/z*.62;
  const inView=(x,y,pad)=>Math.abs(x-S.x)<vr+(pad||0)&&Math.abs(y-S.y)<vr+(pad||0);
  world.land.forEach(l=>{
    const p=l.p;if(!inView(p[0][0],p[0][1],600))return;
    g2.beginPath();p.forEach((q,i)=>i?g2.lineTo(q[0],q[1]):g2.moveTo(q[0],q[1]));g2.closePath();
    g2.fillStyle=l.t==='farmland'?'#151d15':l.t==='reservoir'?'#132a33':'#161a18';g2.fill();});
  g2.lineCap='round';
  world.water.forEach(c=>{
    if(!inView(c.p[0][0],c.p[0][1],900))return;
    g2.strokeStyle='#16303a';g2.lineWidth=9;
    g2.beginPath();c.p.forEach((q,i)=>i?g2.lineTo(q[0],q[1]):g2.moveTo(q[0],q[1]));g2.stroke();});
  world.roads.forEach(rd=>{
    if(!inView(rd.p[0][0],rd.p[0][1],900))return;
    g2.strokeStyle=RCOL[rd.c];g2.lineWidth=RW[rd.c];
    g2.beginPath();rd.p.forEach((q,i)=>i?g2.lineTo(q[0],q[1]):g2.moveTo(q[0],q[1]));g2.stroke();});
  const labels=[];
  world.builds.forEach(b=>{
    if(!inView(b.cx,b.cy))return;
    const t=BT[b.type]||BT.house;
    g2.beginPath();b.pts.forEach((p,i)=>i?g2.lineTo(p[0],p[1]):g2.moveTo(p[0],p[1]));g2.closePath();
    g2.fillStyle=b.searched>=2?'#2a2622':t.col;g2.fill();
    g2.lineWidth=1;g2.strokeStyle=b.isBase?'#8aa863':(b.searched?'#3b332c':'#0a0d0b');g2.stroke();
    const bs=S.bosses.find(x=>x.home===b.id&&!x.dead&&!x.locked);
    if(bs&&dist(S.x,S.y,b.cx,b.cy)<200){g2.fillStyle='rgba(176,74,47,.5)';
      g2.beginPath();g2.arc(b.cx,b.cy,Math.max(13,Math.sqrt(b.area)*.6),0,7);g2.fill();}
    if(b.searched>0||b.isBase||(b.name&&b.area>400))
      labels.push({x:b.cx,y:b.cy,o:Math.sqrt(b.area)*.45,
        t:(b.name||t.n)+(b.searched>=2?' · หมดแล้ว':''),
        c:b.isBase?'#8aa863':t.col,done:b.searched>=2,d:dist(S.x,S.y,b.cx,b.cy)});
  });
  g2.fillStyle='#ddd9c8';g2.beginPath();g2.arc(S.x,S.y,7,0,7);g2.fill();
  g2.strokeStyle='#0b0f0d';g2.lineWidth=2.4;g2.stroke();
  if(S.tx!==null){g2.strokeStyle='rgba(217,164,65,.5)';g2.lineWidth=1.6;
    g2.beginPath();g2.moveTo(S.x,S.y);g2.lineTo(S.tx,S.ty);g2.stroke();
    g2.beginPath();g2.arc(S.tx,S.ty,6,0,7);g2.stroke();}
  g2.restore();

  fgx.setTransform(1,0,0,1,0,0);
  fgx.globalCompositeOperation='source-over';
  fgx.fillStyle='rgba(5,8,7,.95)';fgx.fillRect(0,0,w,h);
  fgx.globalCompositeOperation='destination-out';
  const hw=w/2,hh=h/2;
  for(let i=0;i<S.rev.length;i++){
    const p=S.rev[i],sx=(p[0]-S.x)*z+hw,sy=(p[1]-S.y)*z+hh,R=p[2]*z;
    if(sx<-R||sy<-R||sx>w+R||sy>h+R)continue;
    fgx.drawImage(brush,sx-R,sy-R,R*2,R*2);
  }
  fgx.globalCompositeOperation='source-over';
  g2.drawImage(fogC,0,0,w,h);

  if(z>.28&&labels.length){
    g2.textAlign='center';g2.font='600 11px "Sarabun",system-ui,sans-serif';
    labels.sort((a,b)=>a.d-b.d);
    for(let i=0;i<Math.min(labels.length,45);i++){
      const L=labels[i],sx=(L.x-S.x)*z+hw,sy=(L.y-S.y)*z+hh-L.o*z-7;
      if(sx<-60||sx>w+60||sy<86||sy>h-70)continue;
      const tw=g2.measureText(L.t).width;
      g2.fillStyle='rgba(6,10,8,.72)';g2.fillRect(sx-tw/2-5,sy-11,tw+10,15);
      g2.fillStyle=L.c;g2.fillRect(sx-tw/2-5,sy-11,1.5,15);
      g2.fillStyle=L.done?'rgba(150,158,148,.75)':'rgba(232,226,206,.95)';
      g2.fillText(L.t,sx,sy);
    }
  }
  const hr=S.min/60;let tint=null;
  if(hr<5.5||hr>=19)tint='rgba(6,10,20,.6)';
  else if(hr<7)tint='rgba(30,34,50,.3)';

cv.addEventListener('pointerdown',e=>{

  const b=buildingAt(wx,wy);
  if(b&&dist(S.x,S.y,b.cx,b.cy)<70){openBuilding(b);return;}

let pd=0;
cv.addEventListener('touchmove',e=>{
  if(e.touches.length!==2)return;e.preventDefault();
  const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,
                     e.touches[0].clientY-e.touches[1].clientY);
  if(pd)cam.z=Math.max(.16,Math.min(1.4,cam.z*(d/pd)));pd=d;},{passive:false});

addEventListener('keydown',e=>{

function buildingAt(x,y){let best=null,bd=1e9;
  world.near(x,y,60).forEach(b=>{const d=dist(x,y,b.cx,b.cy);
    if(d<Math.max(16,Math.sqrt(b.area)*.7)&&d<bd){bd=d;best=b;}});return best;}
function nearBuilding(){let best=null,bd=1e9;

function doSearch(id,deep){
  const b=world.builds.find(x=>x.id===id);if(!b)return;
  closeSheet();
  const now=S.day*1440+S.min;
  if(b.searched>=2&&now-b.lastSearch<1440*8){toast('ที่นี่ไม่เหลืออะไรแล้ว');return;}
  if(S.st<(deep?18:8)){toast('พลังไม่พอ ต้องพักก่อน');return;}
  S.st-=deep?18:8;advance(deep?35:15);
  const t=BT[b.type]||BT.house,z=b.zone,zl=ZLOOT[Math.min(3,z-1)];
  const r=rngOf(b.id+'_'+Math.floor(now/1440)+'_'+b.searched);
  const rolls=Math.round((deep?4:2)*t.rich*zl[0]*(1+totFind()*.12));
  const tbl={};
  for(let i=0;i<rolls;i++){if(r()<.18)continue;const k=pick(r,t.loot);tbl[k]=(tbl[k]||0)+1;}
  const got=collect(tbl,b.name||t.n);
  let extra='';
  if(r()<(deep?.14:.05)*t.rich*(t.wc||1)){
    const w=makeWeapon(b.id+now,z,0,t.wpref);
    if(bagWeight()+w.w<=totCarry()){S.weapons.push(w);recordW(w,b.name||t.n);
      extra+='<div class="item acc-'+RAR[w.rar].k+'"><div class="nm"><span class="'+RAR[w.rar].cl+'">'+
       esc(w.n)+'</span><span class="chip">'+RAR[w.rar].n+'</span>'+
       '<div class="tagline">อาวุธ · ATK '+w.atk+'</div></div></div>';}
    else extra+='<div class="item"><div class="nm" style="color:#5f6d64">เจออาวุธแต่แบกไม่ไหว</div></div>';
  }
  if(r()<(deep?.13:.05)*t.rich*(t.gc===undefined?1:t.gc)){
    const g=makeGear(b.id+now+'g',z);
    if(bagWeight()+g.w<=totCarry()){S.gearList.push(g);recordW(g,b.name||t.n);
      extra+='<div class="item acc-'+RAR[g.rar].k+'"><div class="nm"><span class="'+RAR[g.rar].cl+'">'+
       esc(g.n)+'</span><span class="chip">'+RAR[g.rar].n+'</span>'+
       '<div class="tagline">เครื่องสวมใส่ · '+gearLine(g)+'</div></div></div>';}
    else extra+='<div class="item"><div class="nm" style="color:#5f6d64">เจอเครื่องสวมใส่แต่แบกไม่ไหว</div></div>';
  }
  b.searched=Math.min(2,b.searched+(deep?2:1));b.lastSearch=now;S.searched++;markSeen(1);
  gainExp(deep?7:4);
  const lines=got.map(o=>'<div class="item acc-'+ITEMS[o.k].c+'"><div class="nm"'+
    (o.ok?'':' style="color:#5f6d64;text-decoration:line-through"')+'>'+
    ITEMS[o.k].n+' x'+o.n+(o.ok?'':' — แบกไม่ไหว')+'</div></div>').join('');
  sheet('ผลการค้น',(b.name||t.n)+' · '+(deep?'ค้นละเอียด':'ค้นเร็ว'),
    (lines||extra)?'<div class="list">'+lines+extra+'</div>':'<div class="tagline">ไม่เจออะไรเลย</div>',
    'สิ่งที่เก็บได้');
  const noise=(deep?.42:.16)*t.danger*zl[1]*(isNight()?1.6:1)*WX[S.wx].noise;
  setTimeout(()=>{
    if(Math.random()<noise){closeSheet();
      const bs=S.bosses.find(x=>x.home===b.id&&!x.dead&&!x.locked);
      if(bs&&Math.random()<.55)startFight(bs,b);else startFight(spawnGroup(z,b.type),b);}
  },700);
}
/* ---- พักผ่อนเพื่อฟื้นพลัง ---- */
function restGain(b,hrs){
  let per=b?(b.searched>0?22:18):14;      // ในอาคารที่เคยเคลียร์แล้วพักได้ดีกว่า
  if(b&&b.isBase)per=26;
  if(isNight())per-=3;
  if(S.food<20||S.water<20)per=Math.round(per*.5);
  return Math.max(4,Math.round(per*hrs));
}
function restRisk(b,hrs){
  if(b&&b.isBase)return 0;
  const z=zoneOf(S.x,S.y);
  let c=(b?.055:.10)*z*(isNight()?1.7:1)*hrs;
  if(b&&b.searched>=2)c*=.6;
  if(fireOn())c*=(isNight()?.45:.7);      // แสงไฟไล่ซอมบี้ได้บ้าง
  const boss=b&&S.bosses.find(x=>x.home===b.id&&!x.dead&&!x.locked);
  if(boss)c+=.25;
  return Math.min(.85,c*(1-Math.min(.5,totQuiet()*.05)));
}
function restHere(id,hrs,indoor){
  closeSheet();
  const b=id?world.builds.find(x=>x.id===id):null;
  const gain=restGain(b,hrs),risk=restRisk(b,hrs);
  advance(hrs*60);
  S.st=Math.min(S.stMax,S.st+gain);
  if(hrs>=3&&S.food>20&&S.water>20)S.hp=Math.min(S.hpMax,S.hp+6);
  updHUD();
  if(Math.random()<risk){
    toast('มีเสียงมาจากด้านนอก');
    setTimeout(()=>startFight(spawnGroup(zoneOf(S.x,S.y),b?b.type:null),b),500);
  }else{
    toast('พัก '+hrs+' ชั่วโมง · พลัง +'+gain);
  }
}
function sleepNight(){
  closeSheet();
  const to=(S.min<7*60)?7*60-S.min:(24*60-S.min)+7*60;
  advance(to);S.hp=Math.min(S.hpMax,S.hp+45);S.st=S.stMax;
  if(S.inf>0)S.inf=Math.min(100,S.inf+8);
  toast('นอนจนถึงเช้า · ฟื้นเลือดและพลัง');

function useItem(k){

  if(it.water)S.water=Math.min(100,S.water+it.water);

  if(it.st)S.st=Math.min(S.stMax,S.st+it.st);

  if(it.cure){S.inf=0;toast('อาการติดเชื้อหายแล้ว');}
  if(it.buff){addBuff(it.buff,it.buff.h);toast('ได้บัพ '+it.buff.n+' '+it.buff.h+' ชม.');}

function scrapYield(base,rar,durPct){
  const out={},L=craftLv();
  for(const k in base){
    let q=base[k]*(0.45+0.55*durPct);          // ยิ่งพังยิ่งได้น้อย
    q*=1+rar*0.22;                              // ของระดับสูงให้วัสดุมากกว่า
    q*=1+L*0.05;                                // ทักษะช่างรื้อได้เกลี้ยงกว่า
    const n=Math.floor(q)+(Math.random()<(q%1)?1:0);
    if(n>0)out[k]=n;
  }
  if(rar>=2&&Math.random()<0.3+L*0.04)out[rar>=3?'gear':'spring']=(out[rar>=3?'gear':'spring']||0)+1;
  if(rar>=4&&Math.random()<0.5)out.bone=(out.bone||0)+1;
  if(!Object.keys(out).length)out.metal=1;
  return out;
}
function scrapPreview(base,rar){
  return Object.keys(base).map(k=>ITEMS[k].n).join(' · ')+(rar>=2?' · ชิ้นส่วนกลไก':'');
}
function scrapW(i){
  const w=S.weapons[i];if(!w)return;
  if(S.eq===w){toast('ต้องเปลี่ยนไปถืออาวุธอื่นก่อน');return;}
  const y=scrapYield(SCRAP_W[w.key]||{metal:1},w.rar,w.dur/w.durMax);
  S.weapons.splice(i,1);advance(12);S.st=Math.max(0,S.st-4);
  const got=collect(y,'รื้ออาวุธ',1);S.scrapped++;craftGain(3);
  sfx('clank');
  toast('รื้อ '+w.n+' ได้ '+got.filter(o=>o.ok).map(o=>ITEMS[o.k].n+' x'+o.n).join(', '));
  openBag();
}
function scrapG(i){
  const g=S.gearList[i];if(!g)return;
  if(S.gear[g.slot]===g){toast('ต้องถอดออกก่อน');return;}
  const y=scrapYield(SCRAP_G[g.key]||{cloth:1},g.rar,1);
  S.gearList.splice(i,1);advance(10);S.st=Math.max(0,S.st-3);
  const got=collect(y,'รื้อเครื่องสวมใส่',1);S.scrapped++;craftGain(3);
  sfx('clank');
  toast('รื้อ '+g.n+' ได้ '+got.filter(o=>o.ok).map(o=>ITEMS[o.k].n+' x'+o.n).join(', '));
  openBag();
}
function dismantle(k,qty){
  if(!hasItem(k))return;
  const out=DISM[k];if(!out){toast('ชิ้นนี้แยกไม่ได้');return;}
  let n=Math.max(1,Math.min(qty||1,S.bag[k]||0));
  const tot={};
  for(let i=0;i<n;i++){
    if(!hasItem(k))break;
    useUp(k,1);advance(6);
    for(const x in out)tot[x]=(tot[x]||0)+out[x];
  }
  const got=collect(tot,'แยกชิ้นส่วน',1);
  sfx('clank');craftGain(n);
  toast('แยก '+n+' ชิ้น → '+got.filter(o=>o.ok).map(o=>ITEMS[o.k].n+' x'+o.n).join(', '));
  openBag();
}
/* ---- รื้ออาวุธ/ชุดหลายชิ้นรวดเดียว ---- */
function bulkList(kind,maxRar){
  return (kind==='w'?S.weapons:S.gearList).filter(x=>
    x.rar<=maxRar && (kind==='w'?S.eq!==x:S.gear[x.slot]!==x));
}
function scrapBulk(kind,maxRar){
  const list=bulkList(kind,maxRar);
  if(!list.length){toast('ไม่มีของที่เข้าเงื่อนไข');return;}
  const tot={};let n=0;
  list.slice().forEach(x=>{
    const y=kind==='w'?scrapYield(SCRAP_W[x.key]||{metal:1},x.rar,x.dur/x.durMax)
                      :scrapYield(SCRAP_G[x.key]||{cloth:1},x.rar,1);
    for(const k in y)tot[k]=(tot[k]||0)+y[k];
    const arr=kind==='w'?S.weapons:S.gearList;
    const i=arr.indexOf(x);if(i>=0)arr.splice(i,1);
    n++;
  });
  advance(n*(kind==='w'?12:10));S.st=Math.max(0,S.st-n*2);
  S.scrapped+=n;craftGain(n*3);sfx('clank');
  const got=collect(tot,'รื้อรวดเดียว',1);
  sheet('รื้อของ '+n+' ชิ้น','วัสดุที่ได้ทั้งหมด',
    '<div class="list">'+got.map(o=>'<div class="item acc-'+ITEMS[o.k].c+'"><div class="nm'+
    (o.ok?'':' miss')+'">'+ITEMS[o.k].n+'</div><div class="qt">+'+o.n+
    (o.ok?'':' (แบกไม่ไหว)')+'</div></div>').join('')+'</div>'+
    '<div class="row" style="display:flex;margin-top:8px"><button onclick="openBag()">กลับกระเป๋า</button></div>',
    'โรงรื้อของ');
}

function canCraft(rc){
  const atBase=dist(S.x,S.y,world.base.x,world.base.y)<90;
  if(rc.base&&!atBase)return false;
  if(rc.fire&&!fireOn())return false;
  if(rc.lv&&craftLv()<rc.lv)return false;
  if((rc.repair||rc.upgrade||rc.mod)&&!S.eq)return false;
  if(rc.mod&&S.eq&&S.eq.mods.length>=4)return false;
  return rc.need.every(([k,n])=>gHave(k)>=n);
}
function maxCraft(rc){
  if(rc.repair||rc.upgrade||rc.mod||rc.flag)return 1;
  let m=99;
  rc.need.forEach(([k,n])=>{m=Math.min(m,Math.floor(gHave(k)/n));});
  return Math.max(0,Math.min(m,30));
}

function craftOnce(rc){
  const used=[];
  rc.need.forEach(([k,n])=>{gPay(k,n).forEach(u=>used.push(u));});
  S.crafted++;
  const L=craftLv();
  let bonusRar=0;
  for(let t=0;t<3;t++)if(Math.random()<L*0.055)bonusRar++;
  const qual=Math.min(4,1+bonusRar);
  let resName='',resCl='r-c',resInfo='';
  if(rc.give){const got=collect(rc.give,'คราฟเอง',1);
    resName=got.map(o=>ITEMS[o.k].n+' x'+o.n).join(', ');resCl='r-u';}
  if(rc.giveW){
    const w=newWeapon(rc.giveW,qual);
    w.atk=Math.round(w.atk*RAR[qual].mul);
    const pool=AFFIX.slice();
    for(let i=0;i<RAR[qual].slots;i++){
      const x=pool.splice(Math.floor(Math.random()*pool.length),1)[0];
      if(!x)break;x.f(w);w.mods.push(x.n);}
    w.dur=w.durMax;
    if(w.mods.length)w.n=WBASE[rc.giveW].n+' '+w.mods[0];
    if(rc.bonus==='nail'){w.n='ไม้ท่อนตอกตะปู'+(w.mods.length?' '+w.mods[0]:'');w.atk+=5;w.bleed=.25;}
    S.weapons.push(w);if(!S.eq)S.eq=w;recordW(w,'คราฟเอง');
    resName=w.n;resCl=RAR[w.rar].cl;
    resInfo='ATK '+w.atk+' · ตี '+w.spd+' ครั้ง'+(bonusRar?' · ฝีมือช่างระดับ '+RAR[qual].n:'');}
  if(rc.giveG){
    const g=newGear(rc.giveG,qual);
    if(g.def)g.def=Math.round(g.def*RAR[qual].mul);
    const gp=GAFFIX.slice();
    for(let i=0;i<RAR[qual].slots;i++){
      const x=gp.splice(Math.floor(Math.random()*gp.length),1)[0];
      if(!x)break;x.f(g);g.mods.push(x.n);}
    if(g.mods.length)g.n=GBASE[rc.giveG].n+' '+g.mods[0];
    S.gearList.push(g);recordW(g,'คราฟเอง');
    if(!S.gear[g.slot])S.gear[g.slot]=g;
    resName=g.n;resCl=RAR[g.rar].cl;
    resInfo=gearLine(g)+(bonusRar?' · ฝีมือช่างระดับ '+RAR[qual].n:'');}
  if(rc.flag){S[rc.flag]=true;resName=rc.n;resCl='r-u';resInfo='ติดตั้งที่ฐานเรียบร้อย';}
  if(rc.repair&&S.eq){S.eq.dur=Math.min(S.eq.durMax,S.eq.dur+Math.round(S.eq.durMax*.5));
    resName='ซ่อม'+S.eq.n;resInfo='ความทน '+Math.round(S.eq.dur)+'/'+S.eq.durMax;resCl='r-u';}
  if(rc.mod&&S.eq){const m=MODDEF[rc.mod];m.f(S.eq);S.eq.mods.push(m.n);
    resName=S.eq.n;resInfo='ติดตั้ง'+m.n+'แล้ว';resCl=RAR[S.eq.rar].cl;}
  if(rc.upgrade&&S.eq){
    const lv=S.eq.plus||0;
    if(!rc.safe&&lv>=6&&Math.random()<Math.max(.05,.25-L*.02)){
      S.eq.dur=Math.max(1,S.eq.dur-15);resName='ตีบวกล้มเหลว';resCl='r-c';
      resInfo=S.eq.n+' เสียหาย';}
    else{S.eq.plus=lv+1;S.eq.atk+=Math.max(1,Math.round(S.eq.atk*.10));
      S.eq.n=S.eq.n.replace(/ \+\d+$/,'')+' +'+(lv+1);
      resName=S.eq.n;resCl=RAR[S.eq.rar].cl;resInfo='ATK '+S.eq.atk;}
  }
  gainExp(6);
  craftGain(rc.giveW||rc.giveG?6:(rc.upgrade?5:3));
  if(L>0&&used.length&&Math.random()<L*.04){
    const back=used[Math.floor(Math.random()*used.length)];
    addItem(back[0],1);
  }
  return {resName,resCl,resInfo,used};
}
function craft(i,qty){
  const rc=RECIPES[i];
  if(!canCraft(rc)){toast('เงื่อนไขยังไม่ครบ');return;}
  const mx=maxCraft(rc);
  let n=Math.max(1,Math.min(qty||1,mx||1));
  const usedAll={}; let last=null, done=0;
  for(let t=0;t<n;t++){
    if(!canCraft(rc))break;
    last=craftOnce(rc);done++;
    last.used.forEach(u=>{usedAll[u[0]]=(usedAll[u[0]]||0)+u[1];});
    advance(rc.min);S.st=Math.max(0,S.st-Math.max(2,Math.round(6/Math.max(1,n/3))));
    if(S.dead)break;
  }
  if(!last)return;
  const usedList=Object.entries(usedAll);
  if(bagWeight()>totCarry())toast('กระเป๋าหนักเกิน '+bagWeight()+'/'+totCarry()+' กก. — เดินช้าลง');
  craftFX(last.resName+(done>1?' ×'+done:''),last.resCl,
    (done>1?'ทำสำเร็จ '+done+' ชิ้น · ':'')+(last.resInfo||''),usedList);
}
/* ---- เอฟเฟกต์คราฟ ---- */
let AC=null;
function sfx(t){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const c=AC,now=c.currentTime;
    const beep=(f1,f2,dur,type,vol)=>{
      const o=c.createOscillator(),g=c.createGain();
      o.type=type||'square';o.frequency.setValueAtTime(f1,now);
      o.frequency.exponentialRampToValueAtTime(Math.max(30,f2),now+dur);
      g.gain.setValueAtTime(vol||.14,now);
      g.gain.exponentialRampToValueAtTime(.0008,now+dur);
      o.connect(g);g.connect(c.destination);o.start(now);o.stop(now+dur+.02);
    };
    if(t==='clank')beep(210+Math.random()*130,70,.22,'square',.13);
    else if(t==='hit')beep(320+Math.random()*90,110,.09,'square',.09);
    else if(t==='crit')beep(640,150,.16,'sawtooth',.11);
    else if(t==='die')beep(170,42,.38,'sawtooth',.10);
    else if(t==='equip')beep(420,620,.10,'triangle',.09);
    else if(t==='done'){beep(520,780,.14,'triangle',.11);
      setTimeout(()=>{try{const n=AC.currentTime;const o=AC.createOscillator(),g=AC.createGain();
        o.type='triangle';o.frequency.setValueAtTime(780,n);
        o.frequency.exponentialRampToValueAtTime(1180,n+.16);
        g.gain.setValueAtTime(.10,n);g.gain.exponentialRampToValueAtTime(.0008,n+.20);
        o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+.22);}catch(e){}},110);}
  }catch(e){}
}
function sparks(n){
  const wrap=document.querySelector('.fxWrap');if(!wrap)return;
  for(let i=0;i<n;i++){
    const s=document.createElement('div');s.className='spark';
    const a=Math.random()*Math.PI*2,d=34+Math.random()*68;
    s.style.setProperty('--dx',(Math.cos(a)*d).toFixed(1)+'px');
    s.style.setProperty('--dy',(Math.sin(a)*d).toFixed(1)+'px');
    s.style.animationDelay=(Math.random()*.07).toFixed(2)+'s';
    wrap.appendChild(s);setTimeout(()=>s.remove(),750);
  }
}
function craftFX(name,cl,info,used){
  closeSheet();
  const M=document.getElementById('mFx'),core=document.getElementById('fxCore'),

/* ================= โหมดฟาร์มอัตโนมัติ ================= */
let autoT=0,autoWalkT=0;
function toggleAuto(on){
  S.auto=(on===undefined)?!S.auto:!!on;
  const c=document.getElementById('autoChip');
  if(c)c.classList.toggle('on',S.auto);
  if(!S.auto){S.tx=S.ty=null;toast('ปิดโหมดอัตโนมัติ');}
  else toast('เปิดโหมดฟาร์มอัตโนมัติ — แตะป้ายด้านล่างเพื่อหยุด');
  closeSheet();updHUD();
}
function autoStop(msg){S.auto=false;S.tx=S.ty=null;
  const c=document.getElementById('autoChip');if(c)c.classList.remove('on');
  toast(msg);}
function autoTick(t){
  if(t-autoT<620)return;autoT=t;
  if(document.getElementById('mFx').classList.contains('on'))return;
  if(document.getElementById('mFight').classList.contains('on')){autoFight();return;}
  if(document.getElementById('mSheet').classList.contains('on')){closeSheet();return;}
  if(S.tx!==null){
    if(t-autoWalkT>26000){S.tx=S.ty=null;autoWalkT=t;}   // กันเดินค้าง
    return;
  }
  autoWalkT=t;autoDecide();
}
function autoFight(){
  if(!F)return;
  if(F.over){endFight();return;}
  const hpPct=S.hp/S.hpMax, n=alive().length;
  const healK=['bandage','painkill','alcohol'].find(x=>hasItem(x)&&ITEMS[x].heal);
  // เลือดต่ำ → รักษาก่อนเสมอ
  if(hpPct<.62&&healK){useItem(healK);return;}
  // เลือดวิกฤตและไม่มียา → ถอยทันที
  if(hpPct<.64&&!healK){fightRun();return;}
  if(S.lv<5&&hpPct<.72&&n>=2){fightRun();return;}
  if(hpPct<.72&&n>=3){fightRun();return;}
  if(hpPct<.58&&n>=2){fightRun();return;}
  const cost=S.eq?S.eq.st:5;
  if(S.st<cost){
    const k=['energy','coffee','painkill'].find(x=>hasItem(x));
    if(k){useItem(k);return;}
    fightRun();return;
  }
  // ประเมินว่ารอบหน้าจะเจ็บแค่ไหน ถ้ารับไม่ไหวให้หนี
  let incoming=0;
  alive().forEach(e=>{incoming+=Math.max(1,e.atk-totDef())*Math.max(1,Math.round(e.spd));});
  if(S.hp<incoming*3.0&&!healK){fightRun();return;}
  if(S.hp<incoming*2.0){fightRun();return;}
  fightAttack(S.st>S.stMax*.55&&n===1);
}
function autoFindTarget(){
  let best=null,bd=1e9;
  const maxZ=S.autoZone||2;
  for(const b of world.builds){
    if(b.isBase||b.searched>=2)continue;
    if(b.zone>maxZ)continue;
    const d=dist(S.x,S.y,b.cx,b.cy);
    if(d>1400)continue;
    // ให้น้ำหนักร้านที่ของดีกว่า
    const t=BT[b.type]||BT.house;
    const score=d/(1+(t.rich-1)*0.9);
    if(score<bd){bd=score;best=b;}
  }
  return best;
}
function autoEquipBest(){
  let best=S.eq,bs=S.eq?S.eq.atk*(S.eq.dur>0?1:0):0;
  S.weapons.forEach(w=>{const v=w.dur>0?w.atk*(AOE[w.key]?1.25:1):0;
    if(v>bs){bs=v;best=w;}});
  if(best&&best!==S.eq)S.eq=best;
  SLOTS.forEach(s=>{
    if(s.k==='charm')return;
    let cur=S.gear[s.k],cv=cur?cur.def+cur.carry*.5:-1;
    S.gearList.forEach(g=>{if(g.slot!==s.k)return;
      const v=g.def+g.carry*.5;if(v>cv){cv=v;cur=g;}});
    if(cur)S.gear[s.k]=cur;
  });
}
function autoDecide(){
  if(S.dead)return;
  autoEquipBest();
  if(S.food<45){const k=Object.keys(S.bag).find(isFoodK);
    if(k){useItem(k);closeSheet();return;}}
  if(S.water<45){const k=Object.keys(S.bag).find(isWaterK);
    if(k){useItem(k);closeSheet();return;}}
  const atBase=dist(S.x,S.y,world.base.x,world.base.y)<85;
  const full=bagWeight()>=totCarry()*.95;
  const hurt=S.hp<S.hpMax*.62;
  const noFood=!Object.keys(S.bag).some(isFoodK);
  const noWater=!Object.keys(S.bag).some(isWaterK);
  const starving=(S.food<58&&noFood)||(S.water<58&&noWater);
  // พันแผลก่อนถ้ามียา
  if(S.hp<S.hpMax*.7){
    const k=['bandage','painkill'].find(x=>hasItem(x)&&ITEMS[x].heal);
    if(k){useItem(k);closeSheet();return;}
  }
  if(S.inf>=25&&hasItem('antibio')){useItem('antibio');closeSheet();return;}
  if(full||hurt||starving){
    if(atBase){
      if(S.locker)autoStock();
      if(full&&S.locker){depositAll();autoStock();closeSheet();
        if(bagWeight()>=totCarry()*.95){autoStop('คลังเต็มแล้ว — หยุดออโต้');}
        return;}
      if(full&&!S.locker){autoStop('กระเป๋าเต็มและยังไม่มีตู้เก็บของ — หยุดออโต้');return;}
      if(starving){
        autoStock();
        if((S.food<58&&!Object.keys(S.bag).some(isFoodK))||
           (S.water<58&&!Object.keys(S.bag).some(isWaterK))){
          autoStop('เสบียงหมดทั้งกระเป๋าและคลัง — หยุดออโต้ กลับมาเล่นเองต่อได้');return;}
        return;
      }
      if(hurt){sleepNight();closeSheet();return;}
      return;
    }
    // ระหว่างทางกลับ ถ้าเจออาคารที่เคลียร์แล้วก็แวะพักฟื้น
    if(hurt&&S.hp<S.hpMax*.35){
      const nb2=nearBuilding();
      if(nb2&&nb2.searched>=2){restHere(nb2.id,3,1);closeSheet();return;}
    }
    S.tx=world.base.x;S.ty=world.base.y;
    toast(full?'กระเป๋าเต็ม — กลับวัด':'บาดเจ็บ — กลับวัด');
    return;
  }
  if(isNight()&&zoneOf(S.x,S.y)>=3&&S.hp<S.hpMax*.8){
    S.tx=world.base.x;S.ty=world.base.y;toast('กลางคืนอันตราย — ถอยกลับวัด');return;
  }
  if(S.st<14){
    const b=nearBuilding();
    restHere(b?b.id:'',(b&&b.searched>=2)?3:1,b?1:0);closeSheet();return;
  }
  if(atBase&&S.locker&&(countBy(isFoodK,S.bag)<2||countBy(isWaterK,S.bag)<2)){autoStock();}
  const nb=nearBuilding();
  if(nb&&!nb.isBase&&nb.searched<2){
    const deep=(S.lv>=5&&S.st>32&&S.hp>S.hpMax*.8)?1:0;
    doSearch(nb.id,deep);return;}
  const t=autoFindTarget();
  if(t){S.tx=t.cx;S.ty=t.cy;}
  else autoStop('ค้นครบทุกหลังในระยะที่ตั้งไว้แล้ว — หยุดออโต้');
}
/* ================= คลังของที่ฐาน ================= */
const STORE_MAX=150;
function storeWeight(){
  let w=0;for(const k in S.store)w+=ITEMS[k].w*S.store[k];
  (S.storeW||[]).forEach(x=>w+=x.w);(S.storeG||[]).forEach(x=>w+=x.w);
  return Math.round(w*10)/10;
}
const isFoodK=k=>ITEMS[k]&&ITEMS[k].food>=10;
const isWaterK=k=>ITEMS[k]&&ITEMS[k].water>=15;
function countBy(fn,src){let n=0;for(const k in src)if(fn(k))n+=src[k];return n;}
/* เสบียงที่จะเก็บติดตัวไว้เสมอ ไม่ฝากลงคลัง */
function reserveMap(){
  const res={};let f=4,w=4;
  Object.keys(S.bag).forEach(k=>{if(isFoodK(k)&&f>0){
    const t=Math.min(f,S.bag[k]);res[k]=(res[k]||0)+t;f-=t;}});
  Object.keys(S.bag).forEach(k=>{if(isWaterK(k)&&w>0){
    const t=Math.min(w,S.bag[k]);res[k]=Math.max(res[k]||0,Math.min(S.bag[k],(res[k]||0)+t));w-=t;}});
  ['bandage','antibio','lighter','painkill'].forEach(k=>{
    if(S.bag[k])res[k]=Math.max(res[k]||0,Math.min(S.bag[k],k==='bandage'?2:1));});
  return res;
}
/* ถอนเสบียงจากคลังให้พอก่อนออกเดินทาง */
function autoStock(){
  const want=[[isFoodK,4],[isWaterK,4]];
  want.forEach(([fn,target])=>{
    let need=target-countBy(fn,S.bag);
    for(const k in S.store){
      if(need<=0)break;
      if(!fn(k))continue;
      const q=Math.min(need,S.store[k]);
      if(bagWeight()+ITEMS[k].w*q>totCarry())break;
      S.store[k]-=q;if(S.store[k]<=0)delete S.store[k];
      addItem(k,q);need-=q;
    }
  });
  ['bandage','antibio'].forEach(k=>{
    if((S.bag[k]||0)>=2||!S.store[k])return;
    const q=Math.min(2-(S.bag[k]||0),S.store[k]);
    S.store[k]-=q;if(S.store[k]<=0)delete S.store[k];addItem(k,q);
  });
}
function depositAll(all){
  let n=0;
  const res=all?{}:reserveMap();
  for(let i=S.weapons.length-1;i>=0;i--){
    const w=S.weapons[i];if(S.eq===w)continue;
    if(storeWeight()+w.w>STORE_MAX)continue;
    S.weapons.splice(i,1);S.storeW.push(w);n++;
  }
  for(let i=S.gearList.length-1;i>=0;i--){
    const g=S.gearList[i];if(S.gear[g.slot]===g)continue;
    if(storeWeight()+g.w>STORE_MAX)continue;
    S.gearList.splice(i,1);S.storeG.push(g);n++;
  }
  for(const k in Object.assign({},S.bag)){
    const q=S.bag[k]-(res[k]||0);
    if(q<=0)continue;
    if(storeWeight()+ITEMS[k].w*q>STORE_MAX)continue;
    S.store[k]=(S.store[k]||0)+q;useUp(k,q);n+=q;
  }
  toast(n?'ฝากของ '+n+' ชิ้นเข้าคลัง'+(all?'':' (เก็บเสบียงติดตัวไว้)'):'ไม่มีอะไรให้ฝาก หรือคลังเต็ม');
  openStore();
}
function depositMat(){
  let n=0;
  for(const k in S.bag){
    if(ITEMS[k].c!=='mat'&&ITEMS[k].c!=='drop')continue;
    const q=S.bag[k];
    if(storeWeight()+ITEMS[k].w*q>STORE_MAX)continue;
    S.store[k]=(S.store[k]||0)+q;delete S.bag[k];n+=q;
  }
  toast(n?'ฝากวัสดุ '+n+' ชิ้น':'ไม่มีวัสดุให้ฝาก');openStore();
}
function dep(k,all){
  const q=all?S.bag[k]:1;if(!hasItem(k,q))return;
  if(storeWeight()+ITEMS[k].w*q>STORE_MAX){toast('คลังเต็ม');return;}
  useUp(k,q);S.store[k]=(S.store[k]||0)+q;openStore();
}
function wdr(k,all){

  addItem(k,q);openStore();
}
function depW(i){const w=S.weapons[i];if(!w||S.eq===w){toast('ต้องเปลี่ยนอาวุธก่อน');return;}
  if(storeWeight()+w.w>STORE_MAX){toast('คลังเต็ม');return;}

function wdrW(i){const w=S.storeW[i];if(!w)return;
  if(bagWeight()+w.w>totCarry()){toast('กระเป๋าจะเกินน้ำหนัก');return;}

function depG(i){const g=S.gearList[i];if(!g)return;
  if(S.gear[g.slot]===g){toast('ต้องถอดก่อน');return;}
  if(storeWeight()+g.w>STORE_MAX){toast('คลังเต็ม');return;}
  S.gearList.splice(i,1);S.storeG.push(g);openStore();}
function wdrG(i){const g=S.storeG[i];if(!g)return;
  if(bagWeight()+g.w>totCarry()){toast('กระเป๋าจะเกินน้ำหนัก');return;}
  S.storeG.splice(i,1);S.gearList.push(g);openStore();}
function openStore(){
  let h='<div class="tagline">คลัง '+storeWeight()+' / '+STORE_MAX+' กก. · '+
   'กระเป๋า '+bagWeight()+' / '+totCarry()+' กก.</div>'+
   '<div class="row" style="display:flex;gap:6px;margin:8px 0">'+
   '<button class="pri" onclick="depositAll()">ฝาก (เก็บเสบียงไว้)</button>'+
   '<button onclick="depositMat()">เฉพาะวัสดุ</button>'+
   '<button onclick="depositAll(1)">ฝากหมดจริง ๆ</button></div>';
  const cats={food:'อาหารและน้ำ',med:'ยา',mat:'วัสดุ',drop:'ของจากศัตรู'};
  h+='<div class="cat"><span class="t">อยู่ในคลัง</span><span class="r"></span></div>';
  const sk=Object.keys(S.store);
  if(sk.length){
    h+='<div class="list">';
    for(const c in cats){
      sk.filter(k=>ITEMS[k].c===c).forEach(k=>{
        h+='<div class="item acc-'+c+'"><div class="nm">'+ITEMS[k].n+'</div>'+
         '<div class="qt">x'+S.store[k]+'</div>'+
         '<button onclick="wdr(\''+k+'\')">ถอน 1</button>'+
         '<button onclick="wdr(\''+k+'\',1)">ถอนหมด</button></div>';});
    }

const COOK=[
 {n:'เนื้อย่าง',need:{meat:1},give:{grilled:1},min:20},
 {n:'เนื้อเสียบไม้',need:{meat:2,wood:1},give:{skewer:1},min:35},
 {n:'ข้าวต้มร้อน',need:{rice:1,water:1},give:{congee:1},min:30},
 {n:'บะหมี่ต้มร้อน',need:{noodle:1,water:1},give:{hotnoodle:1},min:15},
 {n:'ปลากระป๋องอุ่น',need:{canfish:1},give:{hotfish:1},min:12},
 {n:'ต้มน้ำขุ่นให้สะอาด',need:{dwater:1},give:{water:1},min:20},
];
const fireOn=()=>S.campUntil>nowMin()||(S.stove&&dist(S.x,S.y,world.base.x,world.base.y)<90);
function makeCamp(){
  if(haveK('lighter')<1&&haveK('fuel')<1){toast('ต้องมีไฟแช็กหรือน้ำมันก่อน');return;}
  if(gHave('wood')<1){toast('ต้องมีไม้อย่างน้อย 1');return;}
  gPay('wood',1);
  if(haveK('lighter')<1&&haveK('fuel')>0)payK('fuel',1);
  S.campUntil=nowMin()+180;advance(15);S.st=Math.max(0,S.st-4);
  sfx('done');toast('ก่อกองไฟแล้ว · ไฟติดอยู่ 3 ชั่วโมง');
  openCook();
}
function openCook(){
  const on=fireOn();
  let h=(storeLinked()?'<div class="tagline" style="color:#a9c288">'+
    'เชื่อมกับตู้เก็บของแล้ว — ใช้วัตถุดิบในตู้ปรุงได้เลย</div>':'')+
    '<div class="tagline">'+(on?
    (S.campUntil>nowMin()?'กองไฟยังติดอยู่อีก '+Math.max(1,Math.round((S.campUntil-nowMin())/60))+' ชม.'
      :'ใช้เตาไฟที่ฐาน')
    :'ยังไม่มีไฟ — ก่อกองไฟก่อน (ใช้ไฟแช็ก + ไม้ 1)')+
    '<br>อาหารปรุงสุกให้ค่าอิ่มสูงกว่าและติดบัพชั่วคราว</div>';
  if(!on)h+='<div class="list"><div class="item"><div class="nm">ก่อกองไฟ'+
    '<div class="tagline">ไฟแช็ก (หรือน้ำมัน) + ไม้ 1 · ไฟติด 3 ชม. · พักตอนกลางคืนปลอดภัยขึ้น</div></div>'+
    '<button onclick="makeCamp()">ก่อไฟ</button></div></div>';
  h+='<div class="list">';
  COOK.forEach((c,i)=>{
    const ok=on&&Object.keys(c.need).every(k=>haveK(k)>=c.need[k]);
    const nd=Object.keys(c.need).map(k=>ITEMS[k].n+' '+haveK(k)+'/'+c.need[k]).join(' · ');
    const gk=Object.keys(c.give)[0],gi=ITEMS[gk];
    const bf=gi.buff?' · บัพ '+gi.buff.n+' '+gi.buff.h+' ชม.':'';
    h+='<div class="item acc-food"><div class="nm">'+c.n+
     '<div class="tagline">ใช้ '+nd+' · '+c.min+' นาที</div>'+
     '<div class="tagline" style="color:#a9c288">ได้ '+gi.n+
     (gi.food?' · อิ่ม +'+gi.food:'')+(gi.water?' · น้ำ +'+gi.water:'')+
     (gi.st?' · พลัง +'+gi.st:'')+bf+'</div></div>'+
     '<button '+(ok?'':'disabled')+' onclick="cook('+i+')">ทำ</button></div>';
  });
  sheet('กองไฟ','ปรุงอาหารให้สุกก่อนกิน ปลอดภัยและได้บัพ',h+'</div>','ครัวสนาม');
}
function cook(i){
  const c=COOK[i];
  if(!Object.keys(c.need).every(k=>haveK(k)>=c.need[k]))return;
  Object.keys(c.need).forEach(k=>payK(k,c.need[k]));
  advance(c.min);S.st=Math.max(0,S.st-3);
  const got=collect(c.give,'ปรุงเอง',1);
  craftGain(2);sfx('done');
  toast('ได้ '+got.filter(o=>o.ok).map(o=>ITEMS[o.k].n).join(', '));
  openCook();
}

/* ================= ต่อสู้ =================
   รองรับศัตรูหลายตัวพร้อมกัน · อาวุธบางชนิดโจมตีหมู่ */
const AOE={spear:{n:2,mul:.70,d:'ทะลุ 2 ตัว'},blade:{n:2,mul:.50,d:'ฟันกวาด 2 ตัว'},
 axe:{n:99,mul:.55,d:'เหวี่ยงโดนทุกตัว'},gun:{n:99,mul:.45,d:'ลูกปรายกระจายทุกตัว'}};
let F=null;

function groupSize(zone){
  const r=Math.random();let n=1;
  if(zone===2)n=r<.34?2:1;
  else if(zone===3)n=r<.20?3:(r<.62?2:1);
  else if(zone>=4)n=r<.18?4:(r<.50?3:2);
  if(isNight()&&n<4&&Math.random()<.35)n++;
  return n;
}
function spawnGroup(zone,btype){
  const n=groupSize(zone),out=[];
  const first=makeMob(zone,btype);
  out.push(first);
  for(let i=1;i<n;i++){
    // สัตว์เลี้ยงจะมาเป็นฝูงเดียวกัน ไม่ปนกับซอมบี้
    out.push(first.passive?spawnFrom(first.base,zone):makeMob(zone,btype));
  }
  return out;
}
function prepEnemy(e,i){e.slot=i;e.bleed=0;e.burn=0;e.stun=0;e.dead=false;return e;}
const alive=()=>F.es.filter(e=>!e.dead);
function curTarget(){
  if(F.es[F.target]&&!F.es[F.target].dead)return F.es[F.target];
  const a=alive();if(a.length){F.target=F.es.indexOf(a[0]);return a[0];}
  return null;
}
function startFight(enemy,building){
  const es=(Array.isArray(enemy)?enemy:[enemy]).map(prepEnemy);
  F={es,b:building,noise:0,over:false,target:0};
  const M=document.getElementById('mFight');M.classList.add('on');
  const sc=document.getElementById('fScene');
  sc.className='scene'+(es[0].boss?' boss':'')+(isNight()?' night':'')+
    (S.wx==='rain'?' rain':'')+(S.wx==='fog'?' fog':'');
  document.getElementById('fEnd').style.display='none';
  document.getElementById('fBtns').style.display='';
  document.getElementById('fDrops').innerHTML='';
  ['fAtk','fSkill','fItem','fRun'].forEach(i=>document.getElementById(i).disabled=false);
  document.getElementById('fLog').innerHTML='';
  renderMobs();
  flog(es[0].boss?'r':(es[0].passive?'g':'d'),
    es[0].boss?'บางอย่างที่ใหญ่กว่าคนยืนขวางอยู่'
    :es[0].passive?(es.length>1?'เจอ'+es[0].name+' '+es.length+' ตัว — เนื้อสดเดินได้':
      'เจอ'+es[0].name+' มันไม่สู้ตอบ')
    :(es.length>1?'ฝูงซอมบี้ '+es.length+' ตัวหันมาทางคุณ':'มันหันมาทางคุณ'));
  const w=S.eq,ao=w&&AOE[w.key];
  if(es.length>1&&ao)flog('a','อาวุธที่ถืออยู่'+ao.d);
  fUpd();
}
function renderMobs(){
  const wrap=document.getElementById('fMobs');if(!wrap)return;
  const n=F.es.length;
  wrap.innerHTML='';
  wrap.className='mobRow n'+Math.min(4,n);
  F.es.forEach((e,i)=>{
    const d=document.createElement('div');
    d.className='mobBox'+(e.boss?' bossMob':'')+(e.dead?' dead':'')+
      (i===F.target&&!e.dead?' sel':'');
    d.dataset.i=i;
    const pct=Math.max(0,e.hp/e.hpMax*100);
    d.innerHTML='<div class="mobHp"><i style="width:'+pct+'%"></i></div>'+
      '<img src="'+(SPR[e.spr]||SPR['civ_00'])+'" alt="">'+
      '<div class="mobShadow"></div>'+
      '<div class="mobTag">'+(e.boss?'★ ':'')+esc(e.name)+' <b>Lv.'+e.lv+'</b></div>'+
      '<div class="dmgLayer"></div>';
    d.onclick=()=>{if(!e.dead&&!F.over){F.target=i;renderMobs();}};
    wrap.appendChild(d);
  });
}

function dmgNum(i,v,kind){

function mobHitFX(i,crit){

function shakeScreen(){const sc=document.getElementById('fScene');

function flog(c,t){const l=document.getElementById('fLog');

function fUpd(){
