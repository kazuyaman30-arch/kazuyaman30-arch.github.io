/* เป้าหมายที่โดนโจมตี พร้อมตัวคูณความเสียหาย */
function aoeTargets(w){
  const t=curTarget();if(!t)return[];
  const ao=w&&AOE[w.key];
  if(!ao)return[[t,1]];
  const others=alive().filter(e=>e!==t);
  const take=ao.n>=99?others:others.slice(0,ao.n-1);
  return [[t,1]].concat(take.map(e=>[e,ao.mul]));
}
function hitOne(e,w,heavy,mult){
  const key=w?w.key:null;
  const hits=heavy?1:(w?w.spd:1);
  let total=0;
  for(let i=0;i<hits;i++){
    let d=(w?w.atk*masDmg(key):4)*(heavy?1.9:1)+S.atkB*2+buffSum('atk');
    const crit=Math.random()<((w?w.crit:.05)+masCrit(key)+(heavy?.15:0));
    if(crit)d*=2;
    d-=Math.max(0,(e.arm||0)-((w&&w.pierce)||0));
    const sw=Math.max(.04,.15-masSteady(key));   // ยิ่งชำนาญยิ่งแม่น สวิงน้อย
    d=Math.max(1,Math.round(d*mult*(1-sw+Math.random()*sw*2)));
    total+=d;e.hp-=d;
    dmgNum(e.slot,d,crit?'crit':'');
    mobHitFX(e.slot,crit);
    flog(crit?'a':'g',(mult<1?'โดนหางลม ':'')+e.name+' -'+d+(crit?' (คริติคอล)':''));
    if(w&&w.lifesteal)S.hp=Math.min(S.hpMax,S.hp+Math.round(d*w.lifesteal));
  }
  if(w&&w.bleed&&Math.random()<w.bleed){e.bleed=3;flog('r',e.name+' แผลเปิด เลือดไหล');}
  if(w&&w.burn&&Math.random()<w.burn){e.burn=3;flog('a',e.name+' ไฟลุกติดตัว');}
  if(w&&w.stun&&Math.random()<w.stun){e.stun=1;flog('a',e.name+' เซ ขยับไม่ทัน');}
  return total;
}
function fightAttack(heavy){
  if(F.over)return;
  const w=S.eq;
  if(w&&w.dur<=0)flog('d',w.n+' พังแล้ว — ใช้มือเปล่า');
  const cost=heavy?(w?w.st*2:10):(w?w.st:5);
  if(S.st<cost){flog('d','พลังไม่พอ ใช้ยาแก้ปวด กาแฟ หรือหนี');return;}
  S.st-=cost;
  const useW=(w&&w.dur>0)?w:null;
  const list=aoeTargets(useW);
  if(!list.length)return;
  if(list.length>1)flog('a','เหวี่ยงโดน '+list.length+' ตัว');
  list.forEach(([e,m])=>hitOne(e,useW,heavy,m));
  if(useW){useW.dur=Math.max(0,useW.dur-(heavy?3:1.4));
    masGain(useW.key,1+list.length);}
  F.noise+=(useW?useW.noise:6)*(heavy?1.7:1)*WX[S.wx].noise*(1-Math.min(.6,totQuiet()*.06));
  // เช็คตัวที่ตาย
  let killed=0;
  F.es.forEach(e=>{
    if(!e.dead&&e.hp<=0){e.dead=true;killed++;
      const el=mobEl(e.slot);if(el)el.classList.add('dead');
      flog('a','ล้ม '+e.name+' · EXP +'+e.exp);
      gainExp(e.exp);S.killed++;S.killLog[e.name]=(S.killLog[e.name]||0)+1;
      if(useW)masGain(useW.key,4);
      if(e.boss){e.dead=true;S.bossKill++;}
    }
  });
  if(killed)sfx('die');
  renderMobsHp();
  if(!alive().length){winFight();return;}
  fightEnemyTurn(heavy?7:5);
}
function renderMobsHp(){
  F.es.forEach((e,i)=>{const el=mobEl(i);if(!el)return;
    const bar=el.querySelector('.mobHp i');
    if(bar)bar.style.width=Math.max(0,e.hp/e.hpMax*100)+'%';
    if(e.dead)el.classList.add('dead');});
}
function fightEnemyTurn(mins){
  if(F.over)return;
  // พิษ ไฟ เลือดไหล
  F.es.forEach(e=>{
    if(e.dead)return;
    if(e.bleed>0){e.hp-=6;e.bleed--;flog('r',e.name+' เลือดไหล -6');}
    if(e.burn>0){e.hp-=8;e.burn--;flog('a',e.name+' ไฟไหม้ -8');}
    if(e.regen&&e.hp>0){e.hp=Math.min(e.hpMax,e.hp+e.regen);}
    if(e.hp<=0&&!e.dead){e.dead=true;flog('a',e.name+' ล้มลง');gainExp(e.exp);
      S.killed++;S.killLog[e.name]=(S.killLog[e.name]||0)+1;if(e.boss)S.bossKill++;}
  });
  renderMobsHp();
  if(!alive().length){winFight();return;}
  const actors=F.onlyOne?alive().slice(0,1):alive();
  F.onlyOne=false;
  actors.forEach(e=>{
    if(e.passive){flog('d',e.name+' วิ่งวนหนีไปมา');return;}
    if(e.stun>0){e.stun--;flog('a',e.name+' ขยับไม่ได้');return;}
    const times=Math.max(1,Math.round(e.spd));
    for(let i=0;i<times;i++){
      let d=e.atk*(isNight()?(e.nightMul||1):1)-totDef();
      d=Math.max(1,Math.round(d*(.8+Math.random()*.4)));
      S.hp-=d;flash();shakeScreen();dmgNum(-1,d,'enemy');
      S.lastHitBy=e.name;S.lastHitSpr=e.spr;S.lastHitAt=nowMin();
      flog('r',e.name+' โจมตี -'+d);
      if(S.inf<100&&Math.random()<biteChance(e)){
        const z=e.zone||zoneOf(S.x,S.y),add=6+z*3,was=S.inf;
        S.inf=Math.min(100,S.inf+add);
        flog('r','โดนกัดเข้าเนื้อ! เชื้อ +'+add+'%');
        if(was<25&&S.inf>=25)flog('r','แผลเริ่มอักเสบ — ร่างกายสู้เองไม่ไหวแล้ว');
      }
    }
    if(e.thorn){S.hp-=e.thorn;S.lastHitBy=e.name;S.lastHitSpr=e.spr;S.lastHitAt=nowMin();
      flog('r','หนามพิษ -'+e.thorn);}
    F.noise+=3*(e.noiseMul||1);
  });
  advance(mins||5);
  if(F.noise>=100&&F.es.length<5){
    F.noise=30;
    const add=prepEnemy(makeMob(zoneOf(S.x,S.y),F.b?F.b.type:null),F.es.length);
    F.es.push(add);renderMobs();
    flog('r','เสียงดังเกินไป — '+add.name+' เข้ามาสมทบ');
  }else if(F.noise>=100){F.noise=60;}
  fUpd();
  if(S.hp<=0)die(deathCause());
}
/* โอกาสติดเชื้อจากการโดนโจมตี 1 ครั้ง */
function biteChance(e){
  const z=e.zone||zoneOf(S.x,S.y);
  let c=.055*(e.infMul||.2)*(1+z*.28);
  if(S.hp<S.hpMax*.35)c*=1.7;
  c*=(1-Math.min(.65,totInf()*.13));
  return Math.max(0,Math.min(.30,c));
}
function fightRun(){
  if(F.over)return;
  const n=alive().length;
  if(alive().every(e=>e.passive)){flog('g','เดินจากมาเฉย ๆ');endFight();return;}
  const ch=Math.max(.12,.48+(S.eq&&S.eq.ranged?.1:0)+totQuiet()*.04
    -(F.es.some(e=>e.boss&&!e.dead)?.18:0)-(n-1)*.12);
  if(Math.random()<ch){flog('g','ถอยออกมาได้');S.st=Math.max(0,S.st-12);advance(6);endFight();}
  else{flog('r','หนีไม่พ้น — ถูกตีตอนหันหลัง');F.onlyOne=true;fightEnemyTurn(4);}
}
function rollDrop(tbl){const out={};
  for(const k in tbl){const[a,b]=tbl[k];const q=a+Math.floor(Math.random()*(b-a+1));
    if(q>0)out[k]=q;}return out;}
function winFight(){
  F.over=true;
  ['fAtk','fSkill','fItem','fRun'].forEach(i=>document.getElementById(i).disabled=true);
  const all={};
  F.es.forEach(e=>{const d=rollDrop(e.tbl||{cloth:[0,1]});
    for(const k in d)all[k]=(all[k]||0)+d[k];});
  const got=collect(all,F.es.length>1?'ฝูงซอมบี้':F.es[0].name);
  let extra='';
  F.es.filter(e=>e.boss).forEach(e=>{
    const w=makeWeapon('bd'+e.id,4,2);
    if(bagWeight()+w.w<=totCarry()){S.weapons.push(w);recordW(w,e.name);
      extra+='<div class="l '+RAR[w.rar].cl+'">★ '+esc(w.n)+' — ATK '+w.atk+'</div>';}
    else extra+='<div class="l miss">อาวุธของบอส — แบกไม่ไหว</div>';
    const g=makeGear('bg'+e.id,4);
    if(bagWeight()+g.w<=totCarry()){S.gearList.push(g);recordW(g,e.name);
      extra+='<div class="l '+RAR[g.rar].cl+'">★ '+esc(g.n)+' — '+gearLine(g)+'</div>';}
  });
  const lines=got.map(o=>'<div class="l '+(o.ok?'':'miss')+'">'+ITEMS[o.k].n+' x'+o.n+
    (o.ok?'':' (แบกไม่ไหว)')+'</div>').join('');
  const head=F.es.length>1?'ค้นซาก '+F.es.length+' ตัวแล้วได้':'ค้นตัวมันแล้วได้';
  const html='<div class="drop"><div class="h">'+head+'</div>'+
   (lines||'<div class="l miss">ไม่มีอะไรติดตัวเลย</div>')+extra+'</div>';
  setTimeout(()=>{
    const dd=document.getElementById('fDrops');if(dd)dd.innerHTML=html;
    const bb=document.getElementById('fBtns');if(bb)bb.style.display='none';
    const fe=document.getElementById('fEnd');if(fe)fe.style.display='block';
  },820);
  fUpd();saveGame();
}

/* ================= เลเวล ================= */
function gainExp(n){
  S.exp+=n;
  while(S.exp>=expNeed()){S.exp-=expNeed();S.lv++;S.sp++;S.hpMax+=6;S.stMax+=4;
    S.hp=S.hpMax;S.st=S.stMax;sfx('done');toast('เลเวลอัป Lv.'+S.lv+' · ได้แต้มสกิล');}
  updHUD();
}
function openSkill(){
  const o=[['atkB','นักสู้ — โจมตีแรงขึ้น','+2 พลังโจมตี'],
   ['defB','นักสู้ — ทนขึ้น','+2 ป้องกัน'],
   ['searchB','นักเอาตัวรอด — ค้นของเจอมากขึ้น','+12% ของที่เจอ'],
   ['carryB','นักเอาตัวรอด — แบกหนักขึ้น','+4 กก.'],
   ['quietB','นักเอาตัวรอด — เดินเงียบขึ้น','ลดโอกาสเจอศัตรู']];

   '<div class="tagline">'+x[2]+' · ปัจจุบัน +'+S[x[0]]+'</div></div>'+
   '<button '+(S.sp>0?'':'disabled')+' onclick="spend(\''+x[0]+'\')">ลง 1 แต้ม</button></div>');

   '<div class="row" style="display:flex;margin-top:8px"><button onclick="openChar()">กลับหน้าตัวละคร</button></div>',

function spend(k){if(S.sp<=0)return;S.sp--;S[k]+=(k==='carryB'?4:1);sfx('equip');openSkill();}

/* ================= ตาย / เมนู ================= */
function deathCause(){
  if(S.inf>=100)return 'เชื้อลุกลามจนร่างกายล้มเหลว';
  if(S.lastHitBy&&nowMin()-(S.lastHitAt||-999)<=20)return 'ถูก'+S.lastHitBy+'ฆ่า';
  if(S.water<=0&&S.food<=0)return 'อดอาหารและขาดน้ำ';
  if(S.water<=0)return 'ขาดน้ำจนหมดแรง';
  if(S.food<=0)return 'อดอาหารจนร่างกายทนไม่ไหว';
  return 'บาดแผลสะสมจนร่างกายทนไม่ไหว';
}
function die(reason){
  if(S.dead)return;S.dead=true;S.deathReason=reason;S.tx=S.ty=null;S.auto=false;
  const ac=document.getElementById('autoChip');if(ac)ac.classList.remove('on');
  document.getElementById('mFight').classList.remove('on');
  document.getElementById('mFx').classList.remove('on');
  closeSheet();
  const tot=Object.values(S.found).reduce((a,b)=>a+b,0);
  const g=id=>document.getElementById(id);
  g('dCause').textContent=reason;
  g('dDays').textContent=S.day;
  g('dWhen').textContent='ล้มลงเมื่อวันที่ '+S.day+' เวลา '+clock()+
    ' · ห่างจากวัดสะแก '+(dist(S.x,S.y,world.base.x,world.base.y)>=1000
      ?(dist(S.x,S.y,world.base.x,world.base.y)/1000).toFixed(1)+' กม.'
      :Math.round(dist(S.x,S.y,world.base.x,world.base.y))+' เมตร');
  const kill=g('dKiller');
  if(S.lastHitSpr&&SPR[S.lastHitSpr]&&nowMin()-(S.lastHitAt||-999)<=20)
    kill.innerHTML='<img src="'+SPR[S.lastHitSpr]+'" alt=""><div>'+esc(S.lastHitBy||'')+'</div>';
  else kill.innerHTML='';
  const st=[
   ['เลเวลสุดท้าย','Lv.'+S.lv],
   ['เดินทางรวม',(S.walked/1000).toFixed(2)+' กม.'],
   ['ค้นอาคาร',S.searched+' หลัง'],
   ['ล้มศัตรู',S.killed+' ตัว'],
   ['ล้มบอส',S.bossKill+' ตัว'],
   ['เก็บของได้',tot+' ชิ้น'],
   ['คราฟของ',S.crafted+' ชิ้น'],
   ['รื้อของ',(S.scrapped||0)+' ชิ้น'],
  ];
  g('dStats').innerHTML=st.map(x=>'<div class="dStat"><span>'+x[0]+'</span><b>'+x[1]+'</b></div>').join('');
  // บรรทัดสรุปความชำนาญที่เก่งที่สุด
  let bestK=null,bestL=0;
  MKEYS.forEach(k=>{if(masLv(k)>bestL){bestL=masLv(k);bestK=k;}});
  const notes=[];
  if(bestK)notes.push('ถนัด'+MASNAME[bestK]+'ที่สุด (ระดับ '+bestL+')');
  if(craftLv())notes.push('ทักษะช่างระดับ '+craftLv());
  const topKill=Object.entries(S.killLog||{}).sort((a,b)=>b[1]-a[1])[0];
  if(topKill)notes.push('ล้ม'+topKill[0]+'ไปมากที่สุด '+topKill[1]+' ตัว');
  g('dNote').textContent=notes.join(' · ');
  document.getElementById('mDead').classList.add('on');
  saveGame();
}

/* ================= เซฟ ================= */
const SAVEKEY=n=>'sakae_v5_slot'+n;
const store={
 async set(k,v){try{if(window.storage)return await window.storage.set(k,v);
   localStorage.setItem(k,v);return 1;}catch(e){return null;}},
 async get(k){try{if(window.storage){const r=await window.storage.get(k);return r?r.value:null;}
   return localStorage.getItem(k);}catch(e){return null;}},
 async del(k){try{if(window.storage)return await window.storage.delete(k);
   localStorage.removeItem(k);return 1;}catch(e){return null;}}
};
function saveData(){
  const gsl={};SLOTS.forEach(s=>{const g=S.gear[s.k];gsl[s.k]=g?S.gearList.indexOf(g):-1;});
  return {v:5,ts:Date.now(),day:S.day,lv:S.lv,walked:Math.round(S.walked),
    seed:world.seed,eqi:S.weapons.indexOf(S.eq),gsl,S,
    b:world.builds.filter(x=>x.searched).map(x=>[x.id,x.searched,x.lastSearch])};
}
function packSave(light){
  const d=JSON.parse(JSON.stringify(saveData()));
  if(light&&d.S.rev){
    const seen={},out=[];
    d.S.rev.forEach(p=>{const k=Math.round(p[0]/30)+','+Math.round(p[1]/30);
      if(seen[k])return;seen[k]=1;out.push([p[0],p[1],p[2]]);});
    d.S.rev=out;
  }
  return JSON.stringify(d);
}
function applySave(d){
  if(!d||!d.seed)throw new Error('bad');
  world=buildWorld(d.seed);
  Object.assign(S,d.S);
  S.eq=(d.eqi>=0?S.weapons[d.eqi]:null)||S.weapons[0]||null;
  SLOTS.forEach(s=>{
    const i=d.gsl?d.gsl[s.k]:-1;
    if(s.k==='charm'&&S.gear.charm&&S.gear.charm.from)return;
    S.gear[s.k]=(i>=0&&S.gearList[i])?S.gearList[i]:(s.k==='charm'?S.gear.charm:null);
  });
  const m={};(d.b||[]).forEach(x=>m[x[0]]=x);
  world.builds.forEach(x=>{const y=m[x.id];if(y){x.searched=y[1];x.lastSearch=y[2];}});
  S.dead=false;
  document.getElementById('mDead').classList.remove('on');
  closeSheet();updHUD();
}
async function saveGame(manual,slot){
  const n=slot||S.slot||1;
  try{
    const ok=await store.set(SAVEKEY(n),JSON.stringify(saveData()));
    S.slot=n;
    if(manual){toast(ok?'บันทึกลงช่อง '+n+' แล้ว':'บันทึกไม่สำเร็จ');openSaveMenu();}
  }catch(e){if(manual)toast('บันทึกไม่สำเร็จ');}
}
async function loadGame(slot){
  const n=slot||S.slot||1;
  const raw=await store.get(SAVEKEY(n));
  if(!raw){toast('ช่อง '+n+' ยังว่าง');return;}
  try{applySave(JSON.parse(raw));S.slot=n;toast('โหลดเกมจากช่อง '+n+' แล้ว');}
  catch(e){toast('เซฟเสียหาย');}
}
async function delSave(n){
  await store.del(SAVEKEY(n));toast('ลบช่อง '+n+' แล้ว');openSaveMenu();
}
async function openSaveMenu(){
  let h='<div class="tagline">เกมบันทึกอัตโนมัติลงช่องที่ใช้อยู่ทุกวันใหม่และหลังจบการต่อสู้</div>';
  h+='<div class="list">';
  for(let n=1;n<=3;n++){
    let info='ว่าง',has=false;
    try{
      const raw=await store.get(SAVEKEY(n));
      if(raw){const d=JSON.parse(raw);has=true;
        const t=new Date(d.ts||0);
        info='วันที่ '+(d.day||'?')+' · Lv.'+(d.lv||'?')+' · เดิน '+
          ((d.walked||0)/1000).toFixed(1)+' กม.<br>บันทึกเมื่อ '+
          t.toLocaleDateString('th-TH')+' '+t.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});}
    }catch(e){}
    h+='<div class="item'+(S.slot===n?' acc-u':'')+'"><div class="nm">ช่องเซฟ '+n+
      (S.slot===n?' <span class="chip" style="color:#8aa863">ใช้อยู่</span>':'')+
      '<div class="tagline">'+info+'</div></div>'+
      '<button onclick="saveGame(1,'+n+')">บันทึก</button>'+
      (has?'<button onclick="loadGame('+n+')">โหลด</button>'+
           '<button class="danger" onclick="delSave('+n+')">ลบ</button>':'')+
      '</div>';
  }
  h+='</div>';
  h+='<div class="cat"><span class="t">สำรองข้อมูลข้ามเครื่อง</span><span class="r"></span></div>'+
   '<div class="tagline">ส่งออกเป็นไฟล์แล้วเก็บไว้ใน Google Drive / iCloud ได้ '+
   'เปิดเกมในเครื่องอื่นแล้วนำเข้าไฟล์นั้นเพื่อเล่นต่อ</div>'+
   '<div class="list">'+
   '<div class="item"><div class="nm">ส่งออกเป็นไฟล์<div class="tagline">ได้ไฟล์ .json เก็บไว้ที่ไหนก็ได้</div></div>'+
   '<button class="pri" onclick="exportSaveFile()">ส่งออก</button></div>'+
   '<div class="item"><div class="nm">นำเข้าจากไฟล์<div class="tagline">เลือกไฟล์ .json ที่เคยส่งออกไว้</div></div>'+
   '<button onclick="document.getElementById(\'saveIn\').click()">เลือกไฟล์</button></div>'+
   '<div class="item"><div class="nm">คัดลอกรหัสเซฟ<div class="tagline">ข้อความยาว วางเก็บใน Google Keep / โน้ตได้</div></div>'+
   '<button onclick="copySaveCode()">คัดลอก</button></div>'+
   '<div class="item"><div class="nm">วางรหัสเซฟ<div class="tagline">เอารหัสที่คัดลอกไว้มาวางเพื่อกู้คืน</div></div>'+
   '<button onclick="pasteSaveCode()">วาง</button></div></div>';
  sheet('เซฟและโหลด','3 ช่องเซฟ + สำรองข้อมูลข้ามเครื่อง',h,'บันทึกเกม');
}
function exportSaveFile(){
  try{
    const json=packSave(false);
    const blob=new Blob([json],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    const d=new Date();
    a.href=url;
    a.download='sakae-save-d'+S.day+'-lv'+S.lv+'-'+
      d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'.json';
    document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},1500);
    toast('ส่งออกไฟล์เซฟแล้ว — เก็บไว้ใน Google Drive ได้เลย');
  }catch(e){toast('ส่งออกไม่สำเร็จ ลองใช้ "คัดลอกรหัสเซฟ" แทน');}
}
function b64enc(s){return btoa(String.fromCharCode(...new TextEncoder().encode(s)));}
function b64dec(s){return new TextDecoder().decode(Uint8Array.from(atob(s),c=>c.charCodeAt(0)));}
function copySaveCode(){
  let code;
  try{code='SAKAE1'+b64enc(packSave(true));}catch(e){toast('สร้างรหัสไม่สำเร็จ');return;}
  const done=()=>toast('คัดลอกรหัสเซฟแล้ว ('+Math.round(code.length/1024)+' KB) — วางเก็บไว้ได้เลย');
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(code).then(done,()=>showCode(code));
  }else showCode(code);
}
function showCode(code){
  sheet('รหัสเซฟ','กดค้างเพื่อเลือกทั้งหมดแล้วคัดลอก',
    '<textarea id="codeBox" style="width:100%;height:34vh;background:#080c0a;color:#cfd6c8;'+
    'border:1px solid var(--line2);border-radius:3px;font-size:10px;padding:8px" readonly>'+
    code+'</textarea><div class="row" style="display:flex;margin-top:8px">'+
    '<button class="pri" onclick="document.getElementById(\'codeBox\').select()">เลือกทั้งหมด</button>'+
    '<button onclick="openSaveMenu()">กลับ</button></div>','สำรองข้อมูล');
}
function pasteSaveCode(){
  sheet('วางรหัสเซฟ','วางรหัสที่ขึ้นต้นด้วย SAKAE1 ลงในช่อง แล้วกดกู้คืน',
    '<textarea id="inBox" style="width:100%;height:30vh;background:#080c0a;color:#cfd6c8;'+
    'border:1px solid var(--line2);border-radius:3px;font-size:10px;padding:8px" '+
    'placeholder="SAKAE1..."></textarea>'+
    '<div class="row" style="display:flex;margin-top:8px">'+
    '<button class="pri" onclick="doPasteCode()">กู้คืน</button>'+
    '<button onclick="openSaveMenu()">ยกเลิก</button></div>','สำรองข้อมูล');
}
function doPasteCode(){
  const el=document.getElementById('inBox');
  let v=(el&&el.value||'').trim();
  if(!v.startsWith('SAKAE1')){toast('รหัสไม่ถูกต้อง ต้องขึ้นต้นด้วย SAKAE1');return;}
  try{
    applySave(JSON.parse(b64dec(v.slice(6))));
    toast('กู้คืนเกมจากรหัสเซฟแล้ว');
  }catch(e){toast('รหัสเสียหาย กู้คืนไม่สำเร็จ');}
}

/* ================= UI ================= */
function sheet(t,s,b,eye){
  document.getElementById('sEye').textContent=eye||'บันทึกภาคสนาม';
  document.getElementById('sTitle').textContent=t;
  document.getElementById('sSub').textContent=s||'';
  document.getElementById('sBody').innerHTML=b||'';
  document.getElementById('mSheet').classList.add('on');
  const sc=document.querySelector('#mSheet .sheet');if(sc)sc.scrollTop=0;
}
function closeSheet(){document.getElementById('mSheet').classList.remove('on');}
function toast(t){const d=document.createElement('div');d.className='tst';d.textContent=t;
  document.getElementById('toast').appendChild(d);setTimeout(()=>d.remove(),2700);}
function flash(){const f=document.getElementById('flash');
  f.style.background='rgba(150,20,10,.28)';
  setTimeout(()=>f.style.background='rgba(150,20,10,0)',140);}
function updHUD(){
  const g=id=>document.getElementById(id);
  g('hDay').textContent=S.day;g('hTime').textContent=clock();
  g('hWx').textContent=WX[S.wx].n+(isNight()?' · กลางคืน':'');
  g('hZone').textContent='โซน '+zoneOf(S.x,S.y);
  g('hLv').textContent='Lv.'+S.lv+(S.sp?' ·'+S.sp+' แต้ม':'');
  const d=dist(S.x,S.y,world.base.x,world.base.y);
  g('hPlace').textContent='ห่างวัด '+(d>=1000?(d/1000).toFixed(1)+' กม.':Math.round(d)+' ม.');
  const ring=(id,v,m)=>{const p=Math.max(0,Math.min(100,v/m*100));
    g(id+'F').setAttribute('stroke-dasharray',p.toFixed(1)+' 100');
    g(id+'V').textContent=Math.round(Math.max(0,v));
    g(id).classList.toggle('low',p<25);};
  ring('rHp',S.hp,S.hpMax);ring('rSt',S.st,S.stMax);
  ring('rFd',S.food,100);ring('rWa',S.water,100);
  g('hMark').style.left=(S.min/1440*100).toFixed(2)+'%';
  const ic=g('infChip');ic.classList.toggle('on',S.inf>0);
  if(S.inf>0){
    g('infVal').textContent=Math.round(S.inf);
    const heal=S.inf<25&&S.food>50&&S.water>50;
    ic.style.opacity=heal?'.75':'1';
    ic.lastChild.textContent=heal?'% — กำลังดีขึ้นเอง':(S.inf>=100?'% — วิกฤต หายาด่วน':'% — หายาปฏิชีวนะ');
  }
  const nb=nearBuilding(),ba=g('btnAct'),lab=ba.querySelector('span');
  if(lab)lab.textContent=nb?(nb.isBase?'เข้าฐาน':(nb.searched>0?(nb.name||(BT[nb.type]||BT.house).n):'สำรวจ')):'ไม่มีอาคาร';
  ba.disabled=!nb;
}
function doAction(){const b=nearBuilding();if(b)openBuilding(b);}

/* ================= ผูกปุ่ม ================= */
document.getElementById('saveIn').onchange=e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{try{applySave(JSON.parse(rd.result));toast('นำเข้าเซฟจากไฟล์แล้ว');}
    catch(err){toast('ไฟล์เซฟไม่ถูกต้อง');}};
  rd.readAsText(f);e.target.value='';
};

  sheet('ใช้ของ','ใช้ 1 ชิ้นแล้วศัตรูจะได้โจมตี','<div class="list">'+
   ks.map(k=>'<div class="item acc-'+ITEMS[k].c+'"><div class="nm">'+ITEMS[k].n+'</div>'+

   '</div>','กลางการต่อสู้');

/* ================= GO ================= */
newGame('sakae-'+Math.floor(Math.random()*99999));
updHUD();
document.getElementById('loading').style.display='none';
requestAnimationFrame(step);
